<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Хранилище — Наше Пространство</title>
    
    <!-- ФАВИКОНКИ -->
    <link rel="icon" type="image/png" href="favicon-32x32.png">
    <link rel="icon" type="image/png" href="favicon-16x16.png">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">

    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Marck+Script&family=Manrope:wght@400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --gold: #e8c87a;
            --dark: #050508;
            --panel: rgba(15, 12, 10, 0.95);
            --text: #f0e6d8;
            --border: rgba(232, 200, 122, 0.3);
            --wood-dark: #1a120c;
            --wood-light: #2a1f17;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            background-color: var(--dark); color: var(--text); font-family: "Manrope", sans-serif;
            min-height: 100vh; display: flex; flex-direction: column; align-items: center;
            overflow-x: hidden; opacity: 1; transition: opacity 0.6s ease-in-out;
            
            /* ВИТРАЖНЫЙ ФОН */
            background-image: 
                radial-gradient(circle at 20% 80%, rgba(40, 60, 120, 0.25) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(100, 30, 60, 0.25) 0%, transparent 50%),
                radial-gradient(circle at 50% 50%, #0a0c14 0%, #030305 100%);
            
            background-size: 100% 100%, 100% 100%, 100% 100%;
            background-attachment: fixed;
        }

        body.fade-out { opacity: 0; }

        /* Верхняя панель */
        .top-bar {
            width: 100%; padding: 15px 20px; display: flex; justify-content: flex-end;
            position: fixed; top: 0; right: 0; z-index: 10;
        }
        .logout-btn {
            background: transparent; border: 1px solid #e04545; color: #e04545;
            padding: 8px 15px; border-radius: 8px; cursor: pointer; font-size: 13px; transition: 0.3s;
        }
        .logout-btn:hover { background: #e04545; color: #fff; box-shadow: 0 0 15px rgba(224, 69, 69, 0.4); }

        .main-content {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            width: 100%; min-height: 100vh; padding: 80px 20px 60px;
        }

        .title { font-family: "Playfair Display", serif; font-size: 32px; color: var(--gold); margin-bottom: 10px; font-style: italic; text-shadow: 0 0 20px rgba(232, 200, 122, 0.3); }
        .subtitle { font-size: 14px; color: #a89680; margin-bottom: 30px; text-align: center; }

        /* Поле ввода */
        .search-box {
            display: flex; gap: 10px; margin-bottom: 20px; width: 100%; max-width: 400px;
        }
        .search-box input {
            flex: 1; background: rgba(0,0,0,0.6); border: 1px solid var(--border);
            padding: 15px; color: #fff; font-size: 16px; border-radius: 8px; outline: none;
            text-align: center; text-transform: uppercase; letter-spacing: 0.1em; transition: 0.3s;
        }
        .search-box input:focus { border-color: var(--gold); box-shadow: 0 0 15px rgba(232, 200, 122, 0.2); }
        .search-box button {
            background: var(--gold); color: var(--dark); border: none; padding: 0 25px;
            border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.3s;
        }
        .search-box button:hover { box-shadow: 0 0 20px rgba(232, 200, 122, 0.5); transform: scale(1.05); }

        /* Кнопка создания */
        .create-btn {
            display: none; margin-bottom: 30px; padding: 12px 30px;
            background: transparent; border: 1px dashed var(--gold); color: var(--gold);
            border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 15px; transition: 0.3s;
        }
        .create-btn:hover { background: rgba(232, 200, 122, 0.1); box-shadow: 0 0 15px rgba(232, 200, 122, 0.2); }
        .create-btn.show { display: block; animation: fadeIn 0.4s ease; }

        /* Полка с книгами */
        .bookshelf-wrapper {
            width: 100%; max-width: 900px; overflow: hidden; position: relative;
            padding: 20px 0; display: flex; justify-content: center;
            border-bottom: 8px solid #1a120c;
            border-radius: 0 0 10px 10px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.6);
        }
        
        .books-track {
            display: flex; gap: 20px; padding: 0 20px;
            transition: transform 0.8s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        /* Книга */
        .book {
            width: 140px; height: 200px; flex-shrink: 0;
            background: linear-gradient(145deg, var(--wood-light), var(--wood-dark));
            border: 2px solid #0a0705; border-radius: 4px 12px 12px 4px;
            box-shadow: inset -2px 0 5px rgba(0,0,0,0.5), 5px 5px 15px rgba(0,0,0,0.8);
            position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center;
            transition: all 0.5s ease; transform: scale(0.9); opacity: 0.6;
        }

        .book::before {
            content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 15px;
            background: rgba(0,0,0,0.4); border-right: 1px solid rgba(255,255,255,0.05);
            border-radius: 4px 0 0 4px;
        }

        .book::after {
            content: ""; position: absolute; inset: 12px; border: 1px solid rgba(232, 200, 122, 0.15);
            border-radius: 2px 8px 8px 2px; pointer-events: none;
        }

        .book-title {
            font-family: "Cinzel", serif; color: var(--gold); font-size: 16px;
            text-align: center; writing-mode: vertical-rl; text-orientation: mixed;
            letter-spacing: 0.2em; text-shadow: 0 0 10px rgba(0,0,0,0.8);
        }

        .book.active {
            transform: scale(1.1) translateY(-10px); opacity: 1;
            box-shadow: inset -2px 0 5px rgba(0,0,0,0.5), 0 20px 40px rgba(0,0,0,0.9), 0 0 30px rgba(232, 200, 122, 0.5);
            border-color: var(--gold);
        }

        .open-btn {
            display: none; margin-top: 30px; padding: 15px 50px;
            background: linear-gradient(145deg, var(--gold), #c9a24d); color: var(--dark);
            font-family: "Cinzel", serif; font-size: 18px; font-weight: bold;
            border: none; border-radius: 8px; cursor: pointer; transition: 0.3s;
        }
        .open-btn.show { display: block; animation: fadeInUp 0.5s ease; }
        .open-btn:hover { box-shadow: 0 0 30px rgba(232, 200, 122, 0.7); transform: scale(1.05); }

        @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .error-text { color: #e04545; margin-bottom: 20px; display: none; font-weight: bold; text-shadow: 0 0 10px rgba(224, 69, 69, 0.3); }

        .managed-by {
            position: fixed; bottom: 15px; left: 50%; transform: translateX(-50%);
            font-family: "Cinzel", serif; font-size: 11px; letter-spacing: 0.15em;
            text-transform: uppercase; color: rgba(232, 200, 122, 0.3); pointer-events: none;
        }

        /* Оверлей перехода */
        .page-transition-overlay {
            position: fixed; inset: 0; background: #050508; z-index: 99999;
            pointer-events: none; opacity: 1; transition: opacity 0.6s ease-in-out;
        }
        .page-transition-overlay.hide { opacity: 0; }

        @media (max-width: 768px) {
            .title { font-size: 24px; }
            .search-box { flex-direction: column; }
            .search-box button { padding: 15px; }
            .book { width: 100px; height: 150px; }
            .book-title { font-size: 14px; }
            .managed-by { bottom: 5px; font-size: 9px; }
        }
    </style>
</head>
<body>

    <div class="page-transition-overlay" id="transitionOverlay"></div>

    <div class="top-bar">
        <button class="logout-btn" onclick="logoutUser()">Выйти</button>
    </div>

    <div class="main-content">
        <div class="title">Хранилище</div>
        <div class="subtitle">Введите код комнаты, чтобы найти вашу книгу</div>

        <div class="search-box">
            <input type="text" id="roomInput" placeholder="Код комнаты" autocomplete="off" onkeypress="handleEnter(event)">
            <button onclick="findRoom()">Найти</button>
        </div>

        <div class="error-text" id="errorText">Книга с таким кодом не найдена</div>
        
        <button class="create-btn" id="createBtn" onclick="createRoom()">Создать комнату с таким кодом</button>

        <div class="bookshelf-wrapper">
            <div class="books-track" id="booksTrack">
                <!-- Книги -->
            </div>
        </div>

        <button class="open-btn" id="openBtn" onclick="openRoom()">Открыть книгу</button>
    </div>

    <div class="managed-by">Под управлением Теневого Контура</div>

    <!-- ================= СКРИПТЫ ================= -->
    <script>
        // Плавные переходы
        window.addEventListener('load', () => {
            document.getElementById('transitionOverlay').classList.add('hide');
        });
        document.addEventListener('click', (e) => {
            const link = e.target.closest('a');
            if (link && link.hostname === window.location.hostname && !link.getAttribute('target')) {
                e.preventDefault();
                document.body.classList.add('fade-out');
                setTimeout(() => { window.location.href = link.href; }, 500);
            }
        });

        let foundRoomCode = null;
        let pendingRoomCode = null; 
    </script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getDatabase, ref, get, set } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCwLURoXuJr7GjmvBDB18Tg0rwdI-0TkDc",
            authDomain: "love-a3e53.firebaseapp.com",
            databaseURL: "https://love-a3e53-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "love-a3e53",
            storageBucket: "love-a3e53.firebasestorage.app",
            messagingSenderId: "233454280895",
            appId: "1:233454280895:web:9b0c89b11127e8198be60a"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const auth = getAuth(app);

        let currentUserUID = null;

        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUserUID = user.uid;
                generateDecoyBooks();
            } else {
                window.location.href = 'index.html';
            }
        });

        function generateDecoyBooks() {
            const track = document.getElementById('booksTrack');
            for (let i = 0; i < 10; i++) {
                const book = document.createElement('div');
                book.className = 'book';
                book.innerHTML = `<div class="book-title">•••••</div>`;
                track.appendChild(book);
            }
        }

        window.findRoom = async function() {
            const code = document.getElementById('roomInput').value.trim().toUpperCase();
            if (!code) return;

            const errorText = document.getElementById('errorText');
            const openBtn = document.getElementById('openBtn');
            const createBtn = document.getElementById('createBtn');
            const track = document.getElementById('booksTrack');
            
            errorText.style.display = 'none';
            openBtn.classList.remove('show');
            createBtn.classList.remove('show');
            foundRoomCode = null;
            pendingRoomCode = null;

            const roomRef = ref(db, 'rooms/' + code);
            const snapshot = await get(roomRef);

            if (snapshot.exists()) {
                foundRoomCode = code;
                
                // Удаляем старую активную книгу, если она была
                const oldActive = track.querySelector('.book.active');
                if (oldActive) oldActive.remove();

                const realBook = document.createElement('div');
                realBook.className = 'book active';
                realBook.innerHTML = `<div class="book-title">${code}</div>`;
                track.appendChild(realBook);

                // ИСПРАВЛЕННАЯ ПЕРЕМОТКА (Центрируем книгу)
                setTimeout(() => {
                    const wrapper = document.querySelector('.bookshelf-wrapper');
                    const wrapperWidth = wrapper.clientWidth;
                    
                    // Позиция книги относительно начала трека
                    const bookLeft = realBook.offsetLeft;
                    const bookWidth = realBook.offsetWidth;

                    // Вычисляем сдвиг, чтобы книга была ровно по центру экрана
                    const scrollAmount = bookLeft - (wrapperWidth / 2) + (bookWidth / 2);
                    
                    // Применяем, не давая уехать в минус
                    track.style.transform = `translateX(-${Math.max(0, scrollAmount)}px)`;
                }, 100);

                setTimeout(() => {
                    openBtn.classList.add('show');
                }, 600);

            } else {
                pendingRoomCode = code;
                errorText.textContent = `Комната "${code}" не найдена.`;
                errorText.style.display = 'block';
                createBtn.classList.add('show'); 
            }
        };

        window.createRoom = async function() {
            if (!pendingRoomCode || !currentUserUID) return;

            try {
                await set(ref(db, 'rooms/' + pendingRoomCode), {
                    created: Date.now(),
                    creator: currentUserUID
                });

                await set(ref(db, 'users/' + currentUserUID + '/room'), pendingRoomCode);
                
                document.body.classList.add('fade-out');
                setTimeout(() => { window.location.href = 'book.html'; }, 500);
            } catch (error) {
                alert("Ошибка при создании комнаты: " + error.message);
            }
        };

        window.openRoom = async function() {
            if (!foundRoomCode || !currentUserUID) return;
            try {
                await set(ref(db, 'users/' + currentUserUID + '/room'), foundRoomCode);
                
                document.body.classList.add('fade-out');
                setTimeout(() => { window.location.href = 'book.html'; }, 500);
            } catch (error) {
                alert("Ошибка при входе в комнату: " + error.message);
            }
        };

        window.handleEnter = function(e) {
            if (e.key === 'Enter') findRoom();
        };

        window.logoutUser = async function() {
            await signOut(auth);
            document.body.classList.add('fade-out');
            setTimeout(() => { window.location.href = 'index.html'; }, 500);
        };
    </script>
</body>
</html>
