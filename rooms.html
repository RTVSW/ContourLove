<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Библиотека — Наше Пространство</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Marck+Script&family=Manrope:wght@400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --gold: #e8c87a;
            --dark: #0a0705;
            --panel: rgba(20, 15, 10, 0.95);
            --text: #f0e6d8;
            --border: rgba(232, 200, 122, 0.3);
            --wood-dark: #2a1f17;
            --wood-light: #3a2c22;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            background: var(--dark); color: var(--text); font-family: "Manrope", sans-serif;
            min-height: 100vh; display: flex; flex-direction: column; align-items: center;
            background-image: radial-gradient(circle at 50% 50%, rgba(232, 200, 122, 0.08) 0%, transparent 60%), url('https://images.unsplash.com/photo-1506318137071-a8e063b4bec0?q=80&w=1920&auto=format&fit=crop');
            background-size: cover; background-position: center; background-attachment: fixed;
            overflow: hidden;
        }

        body::before { content: ""; position: fixed; inset: 0; background: rgba(10, 7, 5, 0.9); z-index: -1; }

        /* Верхняя панель */
        .top-bar {
            width: 100%; max-width: 900px; padding: 20px;
            display: flex; justify-content: flex-end; position: absolute; top: 0; right: 0; z-index: 10;
        }
        .logout-btn {
            background: transparent; border: 1px solid #e04545; color: #e04545;
            padding: 8px 15px; border-radius: 8px; cursor: pointer; font-size: 13px; transition: 0.3s;
        }
        .logout-btn:hover { background: #e04545; color: #fff; }

        /* Основной контент */
        .main-content {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            width: 100%; height: 100vh; padding: 20px;
        }

        .title { font-family: "Playfair Display", serif; font-size: 28px; color: var(--gold); margin-bottom: 10px; font-style: italic; }
        .subtitle { font-size: 14px; color: #a89680; margin-bottom: 30px; text-align: center; }

        /* Поле ввода */
        .search-box {
            display: flex; gap: 10px; margin-bottom: 50px; width: 100%; max-width: 400px;
        }
        .search-box input {
            flex: 1; background: rgba(0,0,0,0.6); border: 1px solid var(--border);
            padding: 15px; color: #fff; font-size: 16px; border-radius: 8px; outline: none;
            text-align: center; text-transform: uppercase; letter-spacing: 0.1em;
        }
        .search-box input:focus { border-color: var(--gold); box-shadow: 0 0 15px rgba(232, 200, 122, 0.2); }
        .search-box button {
            background: var(--gold); color: var(--dark); border: none; padding: 0 25px;
            border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.3s;
        }
        .search-box button:hover { box-shadow: 0 0 20px rgba(232, 200, 122, 0.4); }

        /* Полка с книгами */
        .bookshelf-wrapper {
            width: 100%; max-width: 900px; overflow: hidden; position: relative;
            padding: 20px 0;
        }
        
        /* Тень слева и справа для эффекта глубины */
        .bookshelf-wrapper::before, .bookshelf-wrapper::after {
            content: ""; position: absolute; top: 0; bottom: 0; width: 100px; z-index: 5; pointer-events: none;
        }
        .bookshelf-wrapper::before { left: 0; background: linear-gradient(to right, var(--dark), transparent); }
        .bookshelf-wrapper::after { right: 0; background: linear-gradient(to left, var(--dark), transparent); }

        .books-track {
            display: flex; gap: 20px; padding: 0 50px;
            transition: transform 0.8s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        /* Стили книги */
        .book {
            width: 140px; height: 200px; flex-shrink: 0;
            background: linear-gradient(145deg, var(--wood-light), var(--wood-dark));
            border: 2px solid #1a120c; border-radius: 4px 12px 12px 4px;
            box-shadow: 5px 5px 15px rgba(0,0,0,0.8), inset -2px 0 5px rgba(0,0,0,0.5);
            position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center;
            transition: all 0.5s ease; transform: scale(0.9); opacity: 0.6;
        }

        /* Корешок книги */
        .book::before {
            content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 15px;
            background: rgba(0,0,0,0.3); border-right: 1px solid rgba(255,255,255,0.1);
            border-radius: 4px 0 0 4px;
        }

        /* Золотые узоры на книге */
        .book::after {
            content: ""; position: absolute; inset: 10px; border: 1px solid rgba(232, 200, 122, 0.2);
            border-radius: 2px 8px 8px 2px; pointer-events: none;
        }

        .book-title {
            font-family: "Cinzel", serif; color: var(--gold); font-size: 16px;
            text-align: center; writing-mode: vertical-rl; text-orientation: mixed;
            letter-spacing: 0.2em; text-shadow: 1px 1px 2px #000;
        }

        /* Активная книга (которую нашли) */
        .book.active {
            transform: scale(1.1) translateY(-10px); opacity: 1;
            box-shadow: 0 20px 40px rgba(0,0,0,0.9), 0 0 30px rgba(232, 200, 122, 0.4);
            border-color: var(--gold);
        }

        /* Кнопка открытия */
        .open-btn {
            display: none; margin-top: 40px; padding: 15px 50px;
            background: linear-gradient(145deg, var(--gold), #c9a24d); color: var(--dark);
            font-family: "Cinzel", serif; font-size: 18px; font-weight: bold;
            border: none; border-radius: 8px; cursor: pointer; transition: 0.3s;
            animation: fadeInUp 0.5s ease;
        }
        .open-btn.show { display: block; }
        .open-btn:hover { box-shadow: 0 0 30px rgba(232, 200, 122, 0.6); transform: scale(1.05); }

        @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .error-text { color: #e04545; margin-top: 20px; display: none; font-weight: bold; }

        .managed-by {
            position: fixed; bottom: 15px; left: 50%; transform: translateX(-50%);
            font-family: "Cinzel", serif; font-size: 11px; letter-spacing: 0.15em;
            text-transform: uppercase; color: rgba(232, 200, 122, 0.4); pointer-events: none;
        }
    </style>
</head>
<body>

    <div class="top-bar">
        <button class="logout-btn" onclick="logoutUser()">Выйти</button>
    </div>

    <div class="main-content">
        <div class="title">Хранилище</div>
        <div class="subtitle">Введите код комнаты, чтобы найти вашу книгу</div>

        <div class="search-box">
            <input type="text" id="roomInput" placeholder="Код комнаты" autocomplete="off" onkeypress="handleEnter(event)">
            <button onclick="findRoom()">Найти</button>
        </div>

        <div class="error-text" id="errorText">Книга с таким кодом не найдена</div>

        <div class="bookshelf-wrapper">
            <div class="books-track" id="booksTrack">
                <!-- Книги будут добавляться здесь -->
            </div>
        </div>

        <button class="open-btn" id="openBtn" onclick="openRoom()">Открыть книгу</button>
    </div>

    <div class="managed-by">Под управлением Теневого Контура</div>

    <!-- ================= СКРИПТЫ ================= -->
    <script>
        let foundRoomCode = null;
    </script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getDatabase, ref, get, set } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCwLURoXuJr7GjmvBDB18Tg0rwdI-0TkDc",
            authDomain: "love-a3e53.firebaseapp.com",
            databaseURL: "https://love-a3e53-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "love-a3e53",
            storageBucket: "love-a3e53.firebasestorage.app",
            messagingSenderId: "233454280895",
            appId: "1:233454280895:web:9b0c89b11127e8198be60a"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const auth = getAuth(app);

        let currentUserUID = null;

        // Проверка авторизации
        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUserUID = user.uid;
                generateDecoyBooks(); // Создаем пустые книги-обманки
            } else {
                window.location.href = 'index.html';
            }
        });

        // Создаем фоновые книги для красоты
        function generateDecoyBooks() {
            const track = document.getElementById('booksTrack');
            for (let i = 0; i < 10; i++) {
                const book = document.createElement('div');
                book.className = 'book';
                book.innerHTML = `<div class="book-title">•••••</div>`;
                track.appendChild(book);
            }
        }

        // Поиск комнаты
        window.findRoom = async function() {
            const code = document.getElementById('roomInput').value.trim().toUpperCase();
            if (!code) return;

            const errorText = document.getElementById('errorText');
            const openBtn = document.getElementById('openBtn');
            const track = document.getElementById('booksTrack');
            
            errorText.style.display = 'none';
            openBtn.classList.remove('show');
            foundRoomCode = null;

            // Проверяем, существует ли комната в базе
            const roomRef = ref(db, 'rooms/' + code);
            const snapshot = await get(roomRef);

            if (snapshot.exists()) {
                // Комната найдена
                foundRoomCode = code;
                
                // Добавляем "настоящую" книгу
                const realBook = document.createElement('div');
                realBook.className = 'book active';
                realBook.innerHTML = `<div class="book-title">${code}</div>`;
                track.appendChild(realBook);

                // Прокручиваем к ней
                setTimeout(() => {
                    track.style.transform = `translateX(-${track.scrollWidth - 400}px)`;
                }, 100);

                setTimeout(() => {
                    openBtn.classList.add('show');
                }, 600);

            } else {
                // Комната не найдена — трясем полку
                errorText.style.display = 'block';
                track.style.transform = 'translateX(-10px)';
                setTimeout(() => track.style.transform = 'translateX(10px)', 50);
                setTimeout(() => track.style.transform = 'translateX(-10px)', 100);
                setTimeout(() => track.style.transform = 'translateX(0)', 150);
            }
        };

        // Открыть комнату
        window.openRoom = async function() {
            if (!foundRoomCode || !currentUserUID) return;

            try {
                // Привязываем текущего пользователя к этой комнате в его профиле
                await set(ref(db, 'users/' + currentUserUID + '/room'), foundRoomCode);
                
                // Переходим на страницу книги
                window.location.href = 'book.html';
            } catch (error) {
                alert("Ошибка при входе в комнату: " + error.message);
            }
        };

        // Обработка Enter
        window.handleEnter = function(e) {
            if (e.key === 'Enter') findRoom();
        };

        // Выход
        window.logoutUser = async function() {
            await signOut(auth);
            window.location.href = 'index.html';
        };
    </script>
</body>
</html>
