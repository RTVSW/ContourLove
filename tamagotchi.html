<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Тамагочи — Наше Пространство</title>
    
    <link rel="icon" type="image/png" href="favicon-32x32.png">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Marck+Script&family=Manrope:wght@400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --gold: #e8c87a;
            --dark: #0a0705;
            --panel: rgba(20, 15, 10, 0.95);
            --text: #f0e6d8;
            --border: rgba(232, 200, 122, 0.3);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            background: var(--dark); color: var(--text); font-family: "Manrope", sans-serif;
            min-height: 100vh; display: flex; flex-direction: column; align-items: center;
            background-image: url('https://images.unsplash.com/photo-1506318137071-a8e063b4bec0?q=80&w=1920&auto=format&fit=crop');
            background-size: cover; background-position: center; background-attachment: fixed; padding: 20px;
        }

        body::before { content: ""; position: fixed; inset: 0; background: rgba(10, 7, 5, 0.85); z-index: -1; }

        .header { width: 100%; max-width: 500px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .back-btn { color: #a89680; text-decoration: none; border: 1px solid var(--border); padding: 8px 12px; border-radius: 8px; transition: 0.3s; }
        .back-btn:hover { color: var(--gold); border-color: var(--gold); }
        .header h1 { font-family: "Playfair Display", serif; color: var(--gold); font-style: italic; font-size: 24px; }

        .game-area {
            background: var(--panel); border: 1px solid var(--border); border-radius: 16px;
            padding: 30px; width: 100%; max-width: 500px; text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); position: relative; overflow: hidden;
        }

        /* Коробка */
        .box-closed { display: block; }
        .box-open { display: none; }
        
        .gift-box {
            font-size: 100px; cursor: pointer; transition: transform 0.3s;
            filter: drop-shadow(0 10px 20px rgba(0,0,0,0.8));
        }
        .gift-box:hover { transform: scale(1.05); }

        .btn {
            background: linear-gradient(145deg, var(--gold), #c9a24d); color: var(--dark);
            border: none; padding: 15px 30px; border-radius: 8px; font-weight: bold;
            font-size: 16px; cursor: pointer; margin-top: 20px; transition: 0.3s;
            width: 100%; text-transform: uppercase;
        }
        .btn:disabled { background: #333; color: #666; cursor: not-allowed; }
        .btn:hover:not(:disabled) { box-shadow: 0 0 20px rgba(232,200,122,0.5); transform: scale(1.02); }

        .status-text { font-size: 15px; margin-top: 15px; color: #e04545; min-height: 24px; font-weight: bold; }
        .success-text { color: var(--gold); }

        /* Питомец */
        .pet-face { font-size: 100px; transition: 0.3s; margin-bottom: 20px; }
        .stats { display: flex; flex-direction: column; gap: 15px; margin-bottom: 20px; text-align: left; }
        .stat-bar { background: rgba(0,0,0,0.5); border-radius: 10px; overflow: hidden; height: 24px; position: relative; border: 1px solid var(--border); }
        .stat-fill { height: 100%; transition: width 0.5s ease; }
        .stat-label { position: absolute; width: 100%; text-align: center; font-size: 12px; font-weight: bold; line-height: 24px; color: #fff; text-shadow: 0 1px 2px #000; }
        
        .coins-display { font-size: 20px; font-weight: bold; color: var(--gold); margin-bottom: 20px; }
        
        .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .action-btn { padding: 12px; font-size: 14px; }
    </style>
</head>
<body>

    <div class="header">
        <a href="main.html" class="back-btn">← Назад</a>
        <h1>Тамагочи</h1>
    </div>

    <div class="game-area">
        <!-- ЭКРАН 1: ЗАКРЫТАЯ КОРОБКА -->
        <div id="boxClosed" class="box-closed">
            <div class="gift-box">🎁</div>
            <h2 style="color: var(--gold); margin-top: 15px;">Синхронизация рук</h2>
            <p style="color: #a89680; margin-top: 10px; font-size: 14px;">Чтобы открыть коробку, оба партнера должны нажать кнопку.</p>
            
            <button class="btn" id="readyBtn" onclick="readyToOpen()">Я готов открыть</button>
            <div class="status-text" id="boxStatus">Ждем второго игрока...</div>
        </div>

        <!-- ЭКРАН 2: ПИТОМЕЦ -->
        <div id="boxOpen" class="box-open">
            <div class="coins-display">Монеты: <span id="coins">0</span> 🪙</div>
            
            <div class="pet-face" id="petFace">🐈</div>
            
            <div class="stats">
                <div class="stat-bar"><div class="stat-fill" id="hungerFill" style="background: #e04545; width: 100%;"></div><div class="stat-label">Сытость</div></div>
                <div class="stat-bar"><div class="stat-fill" id="happyFill" style="background: #6cb4ee; width: 100%;"></div><div class="stat-label">Счастье</div></div>
            </div>

            <div class="actions">
                <button class="btn action-btn" onclick="feedPet()">Покормить (10 🪙)</button>
                <button class="btn action-btn" onclick="playPet()">Поиграть (+5 🪙)</button>
            </div>
            
            <div style="margin-top: 15px; font-size: 12px; color: #a89680;">
                * Покормить: +30 сытости.<br>
                * Поиграть: +20 счастья, -10 сытости.
            </div>
        </div>
    </div>

    <!-- ================= СКРИПТЫ ================= -->
    <script>
        let currentUserGender = null;
        let currentUserRoom = null;
        let gameData = {};
    </script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getDatabase, ref, onValue, set, update, get } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCwLURoXuJr7GjmvBDB18Tg0rwdI-0TkDc",
            authDomain: "love-a3e53.firebaseapp.com",
            databaseURL: "https://love-a3e53-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "love-a3e53",
            storageBucket: "love-a3e53.firebasestorage.app",
            messagingSenderId: "233454280895",
            appId: "1:233454280895:web:9b0c89b11127e8198be60a"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const auth = getAuth(app);

        onAuthStateChanged(auth, async (user) => {
            if (!user) { window.location.href = 'main.html'; return; }
            
            const snap = await get(ref(db, 'users/' + user.uid + '/profile'));
            const profile = snap.val();
            
            if (!profile || !profile.room) { window.location.href = 'main.html'; return; }
            
            currentUserGender = profile.gender;
            currentUserRoom = profile.room;
            
            startGame();
        });

        function startGame() {
            const gameRef = ref(db, 'rooms/' + currentUserRoom + '/games/tamagotchi');
            
            onValue(gameRef, (snapshot) => {
                let data = snapshot.val();
                
                // Если игры еще нет (комната новая), создаем ее
                if (!data) {
                    data = {
                        isOpen: false,
                        p1Ready: false,
                        p2Ready: false,
                        hunger: 100,
                        happiness: 100,
                        coins: 50 // Начальный капитал
                    };
                    set(gameRef, data);
                    return;
                }
                
                gameData = data;
                updateUI(data);
            });
        }

        function updateUI(data) {
            if (data.isOpen) {
                // Показываем питомца
                document.getElementById('boxClosed').style.display = 'none';
                document.getElementById('boxOpen').style.display = 'block';
                document.getElementById('coins').textContent = data.coins;
                
                // Обновляем полоски
                document.getElementById('hungerFill').style.width = Math.max(0, data.hunger) + '%';
                document.getElementById('happyFill').style.width = Math.max(0, data.happiness) + '%';
                
                // Меняем эмоцию
                const face = document.getElementById('petFace');
                if (data.hunger < 30) face.textContent = '😿';
                else if (data.happiness < 30) face.textContent = '😾';
                else face.textContent = '🐈';
            } else {
                // Логика закрытой коробки
                const btn = document.getElementById('readyBtn');
                const status = document.getElementById('boxStatus');
                
                let iAmReady = (currentUserGender === 'him' && data.p1Ready) || (currentUserGender === 'her' && data.p2Ready);
                
                if (iAmReady) {
                    btn.disabled = true;
                    btn.textContent = "Вы готовы";
                    status.textContent = "Ждем партнера...";
                    status.className = "status-text";
                } else {
                    btn.disabled = false;
                    btn.textContent = "Я готов открыть";
                    
                    let partnerReady = (currentUserGender === 'him' && data.p2Ready) || (currentUserGender === 'her' && data.p1Ready);
                    if (partnerReady) {
                        status.textContent = "Партнер ждет вас! Нажимайте!";
                        status.className = "status-text success-text";
                    } else {
                        status.textContent = "Ждем обоих...";
                        status.className = "status-text";
                    }
                }
            }
        }

        window.readyToOpen = async function() {
            const gameRef = ref(db, 'rooms/' + currentUserRoom + '/games/tamagotchi');
            
            if (currentUserGender === 'him') {
                await update(gameRef, { p1Ready: true });
            } else {
                await update(gameRef, { p2Ready: true });
            }

            // Проверяем, готовы ли оба
            const snap = await get(gameRef);
            const data = snap.val();
            
            if (data.p1Ready && data.p2Ready) {
                await update(gameRef, { isOpen: true });
            }
        };

        window.feedPet = async function() {
            if (gameData.coins < 10) return alert("Недостаточно монет!");
            if (gameData.hunger >= 100) return alert("Питомец уже сыт!");
            
            const gameRef = ref(db, 'rooms/' + currentUserRoom + '/games/tamagotchi');
            await update(gameRef, { 
                hunger: Math.min(100, gameData.hunger + 30),
                coins: gameData.coins - 10
            });
        };

        window.playPet = async function() {
            if (gameData.hunger < 10) return alert("Питомец слишком голоден для игр!");
            
            const gameRef = ref(db, 'rooms/' + currentUserRoom + '/games/tamagotchi');
            await update(gameRef, { 
                happiness: Math.min(100, gameData.happiness + 20),
                hunger: Math.max(0, gameData.hunger - 10),
                coins: gameData.coins + 5
            });
        };
    </script>
</body>
</html>
