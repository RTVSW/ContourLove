<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Наш Сад — Наше Пространство</title>
    
    <link rel="icon" type="image/png" href="favicon-32x32.png">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Marck+Script&family=Manrope:wght@400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --gold: #e8c87a;
            --dark: #0a0705;
            --panel: rgba(20, 15, 10, 0.95);
            --text: #f0e6d8;
            --border: rgba(232, 200, 122, 0.3);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            background: var(--dark); color: var(--text); font-family: "Manrope", sans-serif;
            min-height: 100vh; display: flex; flex-direction: column; align-items: center;
            background-image: url('https://images.unsplash.com/photo-1506318137071-a8e063b4bec0?q=80&w=1920&auto=format&fit=crop');
            background-size: cover; background-position: center; background-attachment: fixed; padding: 20px;
        }

        body::before { content: ""; position: fixed; inset: 0; background: rgba(10, 7, 5, 0.85); z-index: -1; }

        .header { width: 100%; max-width: 500px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .back-btn { color: #a89680; text-decoration: none; border: 1px solid var(--border); padding: 8px 12px; border-radius: 8px; transition: 0.3s; }
        .back-btn:hover { color: var(--gold); border-color: var(--gold); }
        .header h1 { font-family: "Playfair Display", serif; color: var(--gold); font-style: italic; font-size: 24px; }

        .game-area {
            background: var(--panel); border: 1px solid var(--border); border-radius: 16px;
            padding: 30px; width: 100%; max-width: 500px; text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); position: relative;
        }

        /* --- ЭКРАН ПОСАДКИ --- */
        .plant-display { font-size: 100px; margin-bottom: 20px; transition: 0.5s; filter: drop-shadow(0 10px 20px rgba(0,0,0,0.8)); }
        .status-text { font-size: 15px; margin-top: 15px; color: #a89680; min-height: 24px; font-weight: bold; }
        .success-text { color: var(--gold); }

        .btn {
            background: linear-gradient(145deg, var(--gold), #c9a24d); color: var(--dark);
            border: none; padding: 15px 30px; border-radius: 8px; font-weight: bold;
            font-size: 16px; cursor: pointer; margin-top: 20px; transition: 0.3s;
            width: 100%; text-transform: uppercase;
        }
        .btn:disabled { background: #333; color: #666; cursor: not-allowed; }
        .btn:hover:not(:disabled) { box-shadow: 0 0 20px rgba(232,200,122,0.5); transform: scale(1.02); }

        /* --- ЭКРАН РОСТА --- */
        .growing-area { display: none; }
        
        .plant-name { font-family: "Playfair Display", serif; color: var(--gold); font-size: 22px; margin-bottom: 15px; }
        
        .progress-container {
            background: rgba(0,0,0,0.5); border-radius: 10px; overflow: hidden; height: 24px;
            margin-bottom: 10px; position: relative; border: 1px solid var(--border);
        }
        .progress-fill { height: 100%; background: linear-gradient(90deg, #4caf50, #8bc34a); transition: width 0.5s ease; }
        .progress-text { position: absolute; width: 100%; text-align: center; font-size: 12px; line-height: 24px; font-weight: bold; color: #fff; text-shadow: 0 1px 2px #000; }

        .action-buttons { display: flex; flex-direction: column; gap: 10px; margin-top: 20px; }
        .water-btn { background: linear-gradient(145deg, #6cb4ee, #4a90e2); color: #000; }
        .water-btn:hover { box-shadow: 0 0 20px rgba(108, 180, 238, 0.5); }

    </style>
</head>
<body>

    <div class="header">
        <a href="main.html" class="back-btn">← Назад</a>
        <h1>Наш Сад</h1>
    </div>

    <div class="game-area">
        <!-- ЭТАП 1: ПОСАДКА -->
        <div id="plantingArea">
            <div class="plant-display">🪴</div>
            <p style="color: #a89680; margin-bottom: 15px; font-size: 14px;">Земля подготовлена. Чтобы посадить семечко, оба партнера должны нажать кнопку.</p>
            <button class="btn" id="plantBtn" onclick="readyToPlant()">Посадить семечко</button>
            <div class="status-text" id="plantStatus">Ждем второго игрока...</div>
        </div>

        <!-- ЭТАП 2: ВЫРАЩИВАНИЕ -->
        <div id="growingArea" class="growing-area">
            <div class="plant-display" id="plantIcon">🌱</div>
            <h3 class="plant-name" id="plantName">Росток</h3>
            
            <div class="progress-container">
                <div class="progress-fill" id="growthFill"></div>
                <div class="progress-text" id="growthText">0 / 10 очков</div>
            </div>
            <p style="font-size: 12px; color: #a89680; margin-bottom: 20px;">Поливайте растение, чтобы оно росло. Очки синхронизируются.</p>

            <div class="action-buttons">
                <button class="btn water-btn" onclick="waterPlant()">Полить 💧 (+2 очка)</button>
            </div>
        </div>
    </div>

    <!-- ================= СКРИПТЫ ================= -->
    <script>
        let currentUserGender = null;
        let currentUserRoom = null;
        let gameData = {};
    </script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getDatabase, ref, onValue, set, update, get } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCwLURoXuJr7GjmvBDB18Tg0rwdI-0TkDc",
            authDomain: "love-a3e53.firebaseapp.com",
            databaseURL: "https://love-a3e53-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "love-a3e53",
            storageBucket: "love-a3e53.firebasestorage.app",
            messagingSenderId: "233454280895",
            appId: "1:233454280895:web:9b0c89b11127e8198be60a"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const auth = getAuth(app);

        onAuthStateChanged(auth, async (user) => {
            if (!user) { window.location.href = 'main.html'; return; }
            
            const snap = await get(ref(db, 'users/' + user.uid + '/profile'));
            const profile = snap.val();
            
            if (!profile || !profile.room) { window.location.href = 'main.html'; return; }
            
            currentUserGender = profile.gender;
            currentUserRoom = profile.room;
            
            startGame();
        });

        function startGame() {
            const gameRef = ref(db, 'rooms/' + currentUserRoom + '/games/garden');
            
            onValue(gameRef, (snapshot) => {
                let data = snapshot.val();
                
                // Если сада еще нет — создаем начальное состояние
                if (!data) {
                    data = { isPlanted: false, p1Ready: false, p2Ready: false, growth: 0, stage: 0 };
                    set(gameRef, data);
                    return;
                }
                
                gameData = data;
                updateUI(data);
            });
        }

        function updateUI(data) {
            if (data.isPlanted) {
                // Показываем экран роста
                document.getElementById('plantingArea').style.display = 'none';
                document.getElementById('growingArea').style.display = 'block';
                
                // Обновляем иконку и название в зависимости от стадии
                const icon = document.getElementById('plantIcon');
                const name = document.getElementById('plantName');
                
                if (data.stage === 0) { icon.textContent = '🌱'; name.textContent = "Росток"; }
                else if (data.stage === 1) { icon.textContent = '🌿'; name.textContent = "Стебель"; }
                else if (data.stage === 2) { icon.textContent = '🌷'; name.textContent = "Бутон"; }
                else if (data.stage === 3) { icon.textContent = '🌻'; name.textContent = "Цветок"; }
                else { icon.textContent = '🌳'; name.textContent = "Дерево"; }

                // Обновляем прогресс-бар
                let percent = (data.growth / 10) * 100;
                document.getElementById('growthFill').style.width = percent + '%';
                document.getElementById('growthText').textContent = `${data.growth} / 10 очков`;
                
                if (data.growth >= 10 && data.stage < 4) {
                    // Автоматический переход на следующую стадию при 10 очках
                    update(ref(db, 'rooms/' + currentUserRoom + '/games/garden'), { 
                        growth: 0, 
                        stage: data.stage + 1 
                    });
                }
                
            } else {
                // Экран посадки
                const btn = document.getElementById('plantBtn');
                const status = document.getElementById('plantStatus');
                
                let iAmReady = (currentUserGender === 'him' && data.p1Ready) || (currentUserGender === 'her' && data.p2Ready);
                
                if (iAmReady) {
                    btn.disabled = true;
                    btn.textContent = "Вы готовы";
                    status.textContent = "Ждем партнера...";
                    status.className = "status-text";
                } else {
                    btn.disabled = false;
                    btn.textContent = "Посадить семечко";
                    
                    let partnerReady = (currentUserGender === 'him' && data.p2Ready) || (currentUserGender === 'her' && data.p1Ready);
                    if (partnerReady) {
                        status.textContent = "Партнер ждет вас! Нажимайте!";
                        status.className = "status-text success-text";
                    } else {
                        status.textContent = "Ждем обоих...";
                        status.className = "status-text";
                    }
                }
            }
        }

        window.readyToPlant = async function() {
            const gameRef = ref(db, 'rooms/' + currentUserRoom + '/games/garden');
            
            // Отмечаем готовность текущего игрока
            if (currentUserGender === 'him') await update(gameRef, { p1Ready: true });
            else await update(gameRef, { p2Ready: true });

            // Проверяем, готовы ли оба
            const snap = await get(gameRef);
            const data = snap.val();
            
            if (data.p1Ready && data.p2Ready) {
                await update(gameRef, { isPlanted: true });
            }
        };

        window.waterPlant = async function() {
            if (gameData.growth >= 10) return; // Ждем перехода на новую стадию
            
            const gameRef = ref(db, 'rooms/' + currentUserRoom + '/games/garden');
            await update(gameRef, { growth: gameData.growth + 2 });
        };
    </script>
</body>
</html>
