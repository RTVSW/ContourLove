<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Общий Холст — Наше Пространство</title>
    
    <link rel="icon" type="image/png" href="favicon-32x32.png">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Marck+Script&family=Manrope:wght@400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --gold: #e8c87a;
            --dark: #0a0705;
            --panel: rgba(20, 15, 10, 0.95);
            --text: #f0e6d8;
            --border: rgba(232, 200, 122, 0.3);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            background: var(--dark); color: var(--text); font-family: "Manrope", sans-serif;
            min-height: 100vh; display: flex; flex-direction: column; align-items: center;
            background-image: url('https://images.unsplash.com/photo-1506318137071-a8e063b4bec0?q=80&w=1920&auto=format&fit=crop');
            background-size: cover; background-position: center; background-attachment: fixed; padding: 20px;
            overflow: hidden;
        }

        body::before { content: ""; position: fixed; inset: 0; background: rgba(10, 7, 5, 0.85); z-index: -1; }

        .header { width: 100%; max-width: 800px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .back-btn { color: #a89680; text-decoration: none; border: 1px solid var(--border); padding: 8px 12px; border-radius: 8px; transition: 0.3s; }
        .back-btn:hover { color: var(--gold); border-color: var(--gold); }
        .header h1 { font-family: "Playfair Display", serif; color: var(--gold); font-style: italic; font-size: 24px; }

        .game-container {
            background: var(--panel); border: 1px solid var(--border); border-radius: 16px;
            padding: 20px; width: 100%; max-width: 800px; display: flex; flex-direction: column;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); height: calc(100vh - 120px);
        }

        /* Палитра и инструменты */
        .toolbar {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 15px; flex-wrap: wrap; gap: 10px;
        }

        .colors { display: flex; gap: 8px; }
        .color-btn {
            width: 30px; height: 30px; border-radius: 50%; cursor: pointer;
            border: 2px solid transparent; transition: 0.2s;
        }
        .color-btn:hover { transform: scale(1.1); }
        .color-btn.active { border-color: #fff; box-shadow: 0 0 10px rgba(255,255,255,0.5); }

        /* Цвета */
        .c-gold { background: #e8c87a; }
        .c-red { background: #a83232; }
        .c-black { background: #1a1a1a; }
        .c-blue { background: #6cb4ee; }
        .c-green { background: #4caf50; }
        .c-white { background: #f0e6d8; }
        .c-pink { background: #e88ca8; }

        .tools { display: flex; gap: 10px; }
        .tool-btn {
            background: transparent; border: 1px solid var(--border); color: #a89680;
            padding: 8px 15px; border-radius: 8px; cursor: pointer; font-size: 14px; transition: 0.3s;
        }
        .tool-btn:hover, .tool-btn.active { border-color: var(--gold); color: var(--gold); }

        /* Холст */
        .canvas-wrapper {
            flex: 1; position: relative; background: url('https://www.transparenttextures.com/patterns/aged-paper.png'), #f4e8d3;
            border-radius: 8px; overflow: hidden; border: 2px solid #8b6b4a;
            box-shadow: inset 0 0 50px rgba(0,0,0,0.2); touch-action: none;
        }

        canvas { display: block; width: 100%; height: 100%; cursor: crosshair; }

        .actions { display: flex; gap: 10px; margin-top: 15px; }
        .btn {
            flex: 1; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer;
            border: none; text-transform: uppercase; transition: 0.3s;
        }
        .btn-clear { background: transparent; border: 1px solid #e04545; color: #e04545; }
        .btn-clear:hover { background: #e04545; color: #fff; }
        .btn-save { background: var(--gold); color: var(--dark); }
        .btn-save:hover { box-shadow: 0 0 20px rgba(232,200,122,0.5); }

        @media (max-width: 600px) {
            .game-container { padding: 15px; height: calc(100vh - 100px); }
            .color-btn { width: 25px; height: 25px; }
            .tool-btn { padding: 6px 10px; font-size: 12px; }
            .header h1 { font-size: 18px; }
        }
    </style>
</head>
<body>

    <div class="header">
        <a href="main.html" class="back-btn">← Назад</a>
        <h1>Общий Холст</h1>
    </div>

    <div class="game-container">
        <div class="toolbar">
            <div class="colors">
                <div class="color-btn c-gold active" onclick="setColor('#e8c87a', this)"></div>
                <div class="color-btn c-red" onclick="setColor('#a83232', this)"></div>
                <div class="color-btn c-black" onclick="setColor('#1a1a1a', this)"></div>
                <div class="color-btn c-blue" onclick="setColor('#6cb4ee', this)"></div>
                <div class="color-btn c-green" onclick="setColor('#4caf50', this)"></div>
                <div class="color-btn c-white" onclick="setColor('#f0e6d8', this)"></div>
                <div class="color-btn c-pink" onclick="setColor('#e88ca8', this)"></div>
            </div>
            
            <div class="tools">
                <button class="tool-btn active" id="brushBtn" onclick="setTool('brush')">Кисть</button>
                <button class="tool-btn" id="eraserBtn" onclick="setTool('eraser')">Ластик</button>
            </div>
        </div>

        <div class="canvas-wrapper" id="canvasWrapper">
            <canvas id="drawingCanvas"></canvas>
        </div>

        <div class="actions">
            <button class="btn btn-clear" onclick="clearCanvas()">Очистить</button>
            <button class="btn btn-save" onclick="saveCanvas()">Сохранить</button>
        </div>
    </div>

    <!-- ================= СКРИПТЫ ================= -->
    <script>
        let currentUserRoom = null;
        let currentColor = '#e8c87a';
        let currentTool = 'brush';
        let isDrawing = false;
        let lastX = 0, lastY = 0;
        
        // Переменные для синхронизации
        let canvas, ctx;
        let remoteLines = []; 
        let currentLine = null;
    </script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getDatabase, ref, onValue, set, remove, update } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCwLURoXuJr7GjmvBDB18Tg0rwdI-0TkDc",
            authDomain: "love-a3e53.firebaseapp.com",
            databaseURL: "https://love-a3e53-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "love-a3e53",
            storageBucket: "love-a3e53.firebasestorage.app",
            messagingSenderId: "233454280895",
            appId: "1:233454280895:web:9b0c89b11127e8198be60a"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const auth = getAuth(app);

        canvas = document.getElementById('drawingCanvas');
        ctx = canvas.getContext('2d');

        // Настройка размера холста
        function resizeCanvas() {
            const wrapper = document.getElementById('canvasWrapper');
            canvas.width = wrapper.clientWidth;
            canvas.height = wrapper.clientHeight;
            redrawCanvas();
        }

        window.addEventListener('resize', resizeCanvas);

        onAuthStateChanged(auth, async (user) => {
            if (!user) { window.location.href = 'main.html'; return; }
            
            const { get } = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js");
            const snap = await get(ref(db, 'users/' + user.uid + '/profile'));
            const profile = snap.val();
            
            if (!profile || !profile.room) { window.location.href = 'main.html'; return; }
            
            currentUserRoom = profile.room;
            
            // Даем холсту прогрузиться, затем настраиваем размер
            setTimeout(resizeCanvas, 100);
            
            startDrawingSync();
        });

        function startDrawingSync() {
            const drawRef = ref(db, 'rooms/' + currentUserRoom + '/games/drawing/lines');
            
            onValue(drawRef, (snapshot) => {
                const data = snapshot.val();
                remoteLines = [];
                if (data) {
                    for (let key in data) {
                        remoteLines.push(data[key]);
                    }
                }
                redrawCanvas();
            });
        }

        // Функция отрисовки всех линий
        function redrawCanvas() {
            if (!ctx) return;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            remoteLines.forEach(line => {
                if (line.points && line.points.length > 0) {
                    ctx.beginPath();
                    ctx.strokeStyle = line.color;
                    ctx.lineWidth = line.width;
                    ctx.lineCap = 'round';
                    ctx.lineJoin = 'round';
                    
                    const p0 = line.points[0];
                    ctx.moveTo(p0.x, p0.y);
                    
                    for (let i = 1; i < line.points.length; i++) {
                        const p = line.points[i];
                        ctx.lineTo(p.x, p.y);
                    }
                    ctx.stroke();
                }
            });
        }

        // --- ЛОКАЛЬНОЕ РИСОВАНИЕ ---
        function getMousePos(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return {
                x: (clientX - rect.left) / rect.width * canvas.width,
                y: (clientY - rect.top) / rect.height * canvas.height
            };
        }

        function startDraw(e) {
            e.preventDefault();
            isDrawing = true;
            const pos = getMousePos(e);
            currentLine = {
                color: currentTool === 'eraser' ? '#f4e8d3' : currentColor,
                width: currentTool === 'eraser' ? 30 : 5,
                points: [pos]
            };
            
            // Рисуем точку сразу
            ctx.beginPath();
            ctx.arc(pos.x, pos.y, currentLine.width / 2, 0, Math.PI * 2);
            ctx.fillStyle = currentLine.color;
            ctx.fill();
        }

        function draw(e) {
            if (!isDrawing) return;
            e.preventDefault();
            const pos = getMousePos(e);
            currentLine.points.push(pos);
            
            // Локальная отрисовка
            ctx.beginPath();
            ctx.strokeStyle = currentLine.color;
            ctx.lineWidth = currentLine.width;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            
            const prev = currentLine.points[currentLine.points.length - 2];
            ctx.moveTo(prev.x, prev.y);
            ctx.lineTo(pos.x, pos.y);
            ctx.stroke();
            
            // Отправка в Firebase (асинхронно, чтобы не тормозило)
            if (currentLine.points.length % 5 === 0) {
                sendLineToCloud(currentLine);
            }
        }

        function endDraw(e) {
            if (!isDrawing) return;
            isDrawing = false;
            if (currentLine && currentLine.points.length > 0) {
                sendLineToCloud(currentLine);
            }
            currentLine = null;
        }

        async function sendLineToCloud(line) {
            const lineId = Date.now() + '_' + Math.random().toString(36).substr(2, 5);
            await set(ref(db, 'rooms/' + currentUserRoom + '/games/drawing/lines/' + lineId), line);
        }

        // --- ИНСТРУМЕНТЫ ---
        window.setColor = function(color, element) {
            currentColor = color;
            document.querySelectorAll('.color-btn').forEach(btn => btn.classList.remove('active'));
            element.classList.add('active');
            if (currentTool !== 'brush') setTool('brush');
        };

        window.setTool = function(tool) {
            currentTool = tool;
            document.getElementById('brushBtn').classList.toggle('active', tool === 'brush');
            document.getElementById('eraserBtn').classList.toggle('active', tool === 'eraser');
        };

        // --- ДЕЙСТВИЯ ---
        window.clearCanvas = async function() {
            if (!confirm('Очистить холст для обоих?')) return;
            await remove(ref(db, 'rooms/' + currentUserRoom + '/games/drawing/lines'));
            remoteLines = [];
            redrawCanvas();
        };

        window.saveCanvas = function() {
            const link = document.createElement('a');
            link.download = 'nash-risunok.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        };

        // Слушатели мыши и тача
        canvas.addEventListener('mousedown', startDraw);
        canvas.addEventListener('mousemove', draw);
        canvas.addEventListener('mouseup', endDraw);
        canvas.addEventListener('mouseout', endDraw);

        canvas.addEventListener('touchstart', startDraw, { passive: false });
        canvas.addEventListener('touchmove', draw, { passive: false });
        canvas.addEventListener('touchend', endDraw);
    </script>
</body>
</html>
