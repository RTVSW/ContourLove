<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Общий Холст — Наше Пространство</title>
    
    <link rel="icon" type="image/png" href="favicon-32x32.png">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Marck+Script&family=Manrope:wght@400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --gold: #e8c87a;
            --dark: #050508;
            --panel: rgba(20, 15, 10, 0.95);
            --text: #f0e6d8;
            --border: rgba(232, 200, 122, 0.3);
            --ink: #2b1a10;
            --parchment: #f4e8d3;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            background-color: var(--dark); 
            color: var(--text); 
            font-family: "Manrope", sans-serif;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            opacity: 1; 
            transition: opacity 0.6s ease-in-out;
            
            /* ВИТРАЖНЫЙ ФОН */
            background-image: 
                radial-gradient(circle at 10% 90%, rgba(40, 60, 120, 0.2) 0%, transparent 40%),
                radial-gradient(circle at 90% 90%, rgba(100, 30, 60, 0.2) 0%, transparent 40%),
                radial-gradient(circle at 50% 50%, #0a0c14 0%, #030305 100%);
            background-size: 100% 100%, 100% 100%, 100% 100%;
            background-attachment: fixed;
        }

        body.fade-out { opacity: 0; }

        /* Верхняя панель */
        .header { 
            width: 100%; 
            padding: 15px 20px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            flex-shrink: 0;
            background: rgba(5, 5, 8, 0.8);
            border-bottom: 1px solid var(--border);
            z-index: 10;
        }
        .back-btn { 
            color: var(--gold); 
            text-decoration: none; 
            border: 1px solid var(--border); 
            padding: 8px 15px; 
            border-radius: 8px; 
            font-size: 14px; 
            transition: 0.3s;
        }
        .back-btn:hover { background: rgba(232, 200, 122, 0.1); }
        .header h1 { 
            font-family: "Playfair Display", serif; 
            color: var(--gold); 
            font-style: italic; 
            font-size: 20px; 
            text-shadow: 0 0 10px rgba(232, 200, 122, 0.3);
        }

        /* Контейнер игры */
        .game-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 15px;
            max-width: 1000px;
            margin: 0 auto;
            width: 100%;
            overflow: hidden;
        }

        /* Палитра и инструменты */
        .toolbar {
            display: flex; 
            justify-content: space-between; 
            align-items: center;
            margin-bottom: 15px; 
            flex-wrap: wrap; 
            gap: 10px;
            flex-shrink: 0;
        }

        .colors { display: flex; gap: 8px; flex-wrap: wrap; }
        .color-btn {
            width: 30px; height: 30px; border-radius: 50%; cursor: pointer;
            border: 2px solid transparent; transition: 0.2s;
        }
        .color-btn.active { border-color: #fff; transform: scale(1.1); box-shadow: 0 0 10px rgba(255,255,255,0.5); }

        /* Цвета в тон стилю сайта */
        .c-gold { background: #e8c87a; }
        .c-red { background: #a83232; }
        .c-black { background: #1a1a1a; }
        .c-blue { background: #6cb4ee; }
        .c-green { background: #4caf50; }
        .c-parchment { background: #f4e8d3; }
        .c-pink { background: #e88ca8; }

        .tools { display: flex; gap: 10px; }
        .tool-btn {
            background: transparent; border: 1px solid var(--border); color: #a89680;
            padding: 8px 15px; border-radius: 8px; cursor: pointer; font-size: 14px; transition: 0.3s;
        }
        .tool-btn:hover, .tool-btn.active { border-color: var(--gold); color: var(--gold); background: rgba(232, 200, 122, 0.1); }

        /* Холст (Пергамент) */
        .canvas-wrapper {
            flex: 1; 
            position: relative; 
            background: url('https://www.transparenttextures.com/patterns/aged-paper.png'), var(--parchment);
            border-radius: 8px; 
            overflow: hidden; 
            border: 4px solid #1a120c;
            box-shadow: inset 0 0 50px rgba(0,0,0,0.3), 0 0 30px rgba(232, 200, 122, 0.15); 
            touch-action: none;
            min-height: 0;
        }

        canvas { display: block; width: 100%; height: 100%; cursor: crosshair; }

        /* Кнопки действий */
        .actions { 
            display: flex; 
            gap: 15px; 
            margin-top: 15px; 
            flex-shrink: 0;
        }
        .btn {
            flex: 1; padding: 15px; border-radius: 8px; font-weight: bold; cursor: pointer;
            border: none; text-transform: uppercase; transition: 0.3s; font-family: "Cinzel", serif;
            font-size: 15px;
        }
        .btn-clear { 
            background: transparent; border: 1px solid #e04545; color: #e04545; 
        }
        .btn-clear:hover { background: #e04545; color: #fff; box-shadow: 0 0 20px rgba(224, 69, 69, 0.4); }
        
        .btn-save { 
            background: linear-gradient(145deg, var(--gold), #c9a24d); color: var(--dark); 
        }
        .btn-save:hover { box-shadow: 0 0 20px rgba(232,200,122,0.5); transform: scale(1.02); }

        /* Подпись */
        .managed-by {
            position: fixed; bottom: 10px; left: 50%; transform: translateX(-50%);
            font-family: "Cinzel", serif; font-size: 10px; letter-spacing: 0.15em;
            text-transform: uppercase; color: rgba(232, 200, 122, 0.3); pointer-events: none;
            white-space: nowrap; z-index: 100;
        }

        /* Оверлей перехода */
        .page-transition-overlay {
            position: fixed; inset: 0; background: #050508; z-index: 99999;
            pointer-events: none; opacity: 1; transition: opacity 0.6s ease-in-out;
        }
        .page-transition-overlay.hide { opacity: 0; }

        /* Мобильная адаптация */
        @media (max-width: 600px) {
            .header h1 { font-size: 16px; }
            .color-btn { width: 26px; height: 26px; }
            .tool-btn { padding: 6px 10px; font-size: 12px; }
            .btn { padding: 12px; font-size: 14px; }
            .canvas-wrapper { border-width: 2px; }
            .managed-by { display: none; } /* Скрываем на телефоне, чтобы не мешала */
        }
    </style>
</head>
<body>

    <div class="page-transition-overlay" id="transitionOverlay"></div>

    <div class="header">
        <a href="book.html" class="back-btn">← В книгу</a>
        <h1>Общий Холст</h1>
        <div style="width: 80px;"></div> <!-- Заглушка для центрирования -->
    </div>

    <div class="game-container">
        <div class="toolbar">
            <div class="colors">
                <div class="color-btn c-gold active" onclick="setColor('#e8c87a', this)"></div>
                <div class="color-btn c-red" onclick="setColor('#a83232', this)"></div>
                <div class="color-btn c-black" onclick="setColor('#1a1a1a', this)"></div>
                <div class="color-btn c-blue" onclick="setColor('#6cb4ee', this)"></div>
                <div class="color-btn c-green" onclick="setColor('#4caf50', this)"></div>
                <div class="color-btn c-pink" onclick="setColor('#e88ca8', this)"></div>
            </div>
            
            <div class="tools">
                <button class="tool-btn active" id="brushBtn" onclick="setTool('brush')">Кисть</button>
                <button class="tool-btn" id="eraserBtn" onclick="setTool('eraser')">Ластик</button>
            </div>
        </div>

        <div class="canvas-wrapper" id="canvasWrapper">
            <canvas id="drawingCanvas"></canvas>
        </div>

        <div class="actions">
            <button class="btn btn-clear" onclick="clearCanvas()">Очистить</button>
            <button class="btn btn-save" onclick="saveCanvas()">Сохранить</button>
        </div>
    </div>

    <div class="managed-by">Под управлением Теневого Контура</div>

    <!-- ================= СКРИПТЫ ================= -->
    <script>
        // Плавные переходы
        window.addEventListener('load', () => {
            document.getElementById('transitionOverlay').classList.add('hide');
        });
        document.addEventListener('click', (e) => {
            const link = e.target.closest('a');
            if (link && link.hostname === window.location.hostname && !link.getAttribute('target')) {
                e.preventDefault();
                document.body.classList.add('fade-out');
                setTimeout(() => { window.location.href = link.href; }, 500);
            }
        });

        let currentUserRoom = null;
        let currentColor = '#e8c87a';
        let currentTool = 'brush';
        let isDrawing = false;
        
        let canvas, ctx;
        let remoteLines = []; 
        let currentLine = null;
    </script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getDatabase, ref, onValue, set, remove, get } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCwLURoXuJr7GjmvBDB18Tg0rwdI-0TkDc",
            authDomain: "love-a3e53.firebaseapp.com",
            databaseURL: "https://love-a3e53-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "love-a3e53",
            storageBucket: "love-a3e53.firebasestorage.app",
            messagingSenderId: "233454280895",
            appId: "1:233454280895:web:9b0c89b11127e8198be60a"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const auth = getAuth(app);

        canvas = document.getElementById('drawingCanvas');
        ctx = canvas.getContext('2d');

        function resizeCanvas() {
            const wrapper = document.getElementById('canvasWrapper');
            // Сохраняем рисунок при ресайзе
            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = canvas.width;
            tempCanvas.height = canvas.height;
            tempCanvas.getContext('2d').drawImage(canvas, 0, 0);

            canvas.width = wrapper.clientWidth;
            canvas.height = wrapper.clientHeight;
            
            ctx.drawImage(tempCanvas, 0, 0, canvas.width, canvas.height);
            redrawCanvas();
        }

        window.addEventListener('resize', resizeCanvas);

        onAuthStateChanged(auth, async (user) => {
            if (!user) { window.location.href = 'index.html'; return; }
            
            const snap = await get(ref(db, 'users/' + user.uid));
            const profile = snap.val();
            
            if (!profile || !profile.room) { window.location.href = 'rooms.html'; return; }
            
            currentUserRoom = profile.room;
            
            setTimeout(resizeCanvas, 100);
            startDrawingSync();
        });

        function startDrawingSync() {
            const drawRef = ref(db, 'rooms/' + currentUserRoom + '/games/drawing/lines');
            
            onValue(drawRef, (snapshot) => {
                const data = snapshot.val();
                remoteLines = [];
                if (data) {
                    for (let key in data) {
                        remoteLines.push(data[key]);
                    }
                }
                redrawCanvas();
            });
        }

        function redrawCanvas() {
            if (!ctx) return;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            remoteLines.forEach(line => {
                if (line.points && line.points.length > 0) {
                    ctx.beginPath();
                    ctx.strokeStyle = line.color;
                    ctx.lineWidth = line.width;
                    ctx.lineCap = 'round';
                    ctx.lineJoin = 'round';
                    
                    const p0 = line.points[0];
                    ctx.moveTo(p0.x, p0.y);
                    
                    for (let i = 1; i < line.points.length; i++) {
                        const p = line.points[i];
                        ctx.lineTo(p.x, p.y);
                    }
                    ctx.stroke();
                }
            });
        }

        function getMousePos(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return {
                x: (clientX - rect.left) / rect.width * canvas.width,
                y: (clientY - rect.top) / rect.height * canvas.height
            };
        }

        function startDraw(e) {
            e.preventDefault();
            isDrawing = true;
            const pos = getMousePos(e);
            currentLine = {
                color: currentTool === 'eraser' ? '#f4e8d3' : currentColor,
                width: currentTool === 'eraser' ? 30 : 5,
                points: [pos]
            };
            
            ctx.beginPath();
            ctx.arc(pos.x, pos.y, currentLine.width / 2, 0, Math.PI * 2);
            ctx.fillStyle = currentLine.color;
            ctx.fill();
        }

        function draw(e) {
            if (!isDrawing) return;
            e.preventDefault();
            const pos = getMousePos(e);
            currentLine.points.push(pos);
            
            ctx.beginPath();
            ctx.strokeStyle = currentLine.color;
            ctx.lineWidth = currentLine.width;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            
            const prev = currentLine.points[currentLine.points.length - 2];
            ctx.moveTo(prev.x, prev.y);
            ctx.lineTo(pos.x, pos.y);
            ctx.stroke();
            
            if (currentLine.points.length % 5 === 0) {
                sendLineToCloud(currentLine);
            }
        }

        function endDraw(e) {
            if (!isDrawing) return;
            isDrawing = false;
            if (currentLine && currentLine.points.length > 0) {
                sendLineToCloud(currentLine);
            }
            currentLine = null;
        }

        async function sendLineToCloud(line) {
            if (!currentUserRoom) return;
            const lineId = Date.now() + '_' + Math.random().toString(36).substr(2, 5);
            await set(ref(db, 'rooms/' + currentUserRoom + '/games/drawing/lines/' + lineId), line);
        }

        window.setColor = function(color, element) {
            currentColor = color;
            document.querySelectorAll('.color-btn').forEach(btn => btn.classList.remove('active'));
            element.classList.add('active');
            if (currentTool !== 'brush') setTool('brush');
        };

        window.setTool = function(tool) {
            currentTool = tool;
            document.getElementById('brushBtn').classList.toggle('active', tool === 'brush');
            document.getElementById('eraserBtn').classList.toggle('active', tool === 'eraser');
        };

        window.clearCanvas = async function() {
            if (!currentUserRoom) return;
            if (!confirm('Очистить холст для обоих?')) return;
            await remove(ref(db, 'rooms/' + currentUserRoom + '/games/drawing/lines'));
            remoteLines = [];
            redrawCanvas();
        };

        window.saveCanvas = function() {
            const link = document.createElement('a');
            link.download = 'nash-risunok.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        };

        canvas.addEventListener('mousedown', startDraw);
        canvas.addEventListener('mousemove', draw);
        canvas.addEventListener('mouseup', endDraw);
        canvas.addEventListener('mouseout', endDraw);

        canvas.addEventListener('touchstart', startDraw, { passive: false });
        canvas.addEventListener('touchmove', draw, { passive: false });
        canvas.addEventListener('touchend', endDraw);
    </script>
</body>
</html>
