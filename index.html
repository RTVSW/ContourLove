<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Запрос доступа</title>
    
    <!-- ФАВИКОНКИ -->
    <link rel="icon" type="image/png" href="favicon-32x32.png">
    <link rel="icon" type="image/png" href="favicon-16x16.png">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">

    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold: #e8c87a;
            --gold-bright: #f5d98a;
            --dark: #0a0705;
            --panel: rgba(20, 15, 10, 0.95);
            --text: #f0e6d8;
            --border: rgba(232, 200, 122, 0.3);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            background: var(--dark);
            color: var(--text);
            font-family: "Manrope", sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-image: 
                radial-gradient(circle at 50% 50%, rgba(232, 200, 122, 0.08) 0%, transparent 60%),
                url('https://images.unsplash.com/photo-1506318137071-a8e063b4bec0?q=80&w=1920&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            overflow: hidden;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background: rgba(10, 7, 5, 0.85);
            z-index: -1;
        }

        .terminal-box {
            background: var(--panel);
            border: 1px solid var(--border);
            padding: 40px 30px;
            border-radius: 16px;
            text-align: center;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.8);
            animation: fadeIn 0.8s ease;
        }

        .terminal-box h1 {
            font-family: "Cinzel", serif;
            font-size: 24px;
            color: var(--gold);
            margin-bottom: 15px;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }

        .terminal-box p { 
            font-size: 14px; 
            color: #a89680; 
            margin-bottom: 25px; 
            line-height: 1.5;
        }

        .terminal-box input {
            width: 100%;
            background: rgba(0,0,0,0.5);
            border: 1px solid var(--border);
            padding: 15px;
            color: var(--text);
            font-size: 16px;
            text-align: center;
            letter-spacing: 0.2em;
            border-radius: 8px;
            margin-bottom: 20px;
            outline: none;
            transition: 0.3s;
            -webkit-appearance: none;
            text-transform: uppercase;
        }

        .terminal-box input:focus { 
            border-color: var(--gold); 
            box-shadow: 0 0 15px rgba(232, 200, 122, 0.2); 
        }

        .terminal-box button {
            background: linear-gradient(145deg, rgba(60, 42, 20, 1), rgba(40, 26, 12, 1));
            border: 1px solid rgba(245, 217, 138, 0.5);
            color: var(--gold-bright);
            padding: 15px;
            font-family: "Cinzel", serif;
            font-size: 16px;
            border-radius: 8px;
            width: 100%;
            cursor: pointer;
            transition: 0.3s;
            -webkit-appearance: none;
        }

        .terminal-box button:hover { 
            box-shadow: 0 0 20px rgba(232, 200, 122, 0.3); 
        }

        .error-msg { 
            color: #e04545; 
            font-size: 13px; 
            margin-top: 15px; 
            display: none; 
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn { 
            from { opacity: 0; transform: translateY(20px); } 
            to { opacity: 1; transform: translateY(0); } 
        }
    </style>
</head>
<body>

    <div class="terminal-box" id="terminalBox">
        <h1>ЗАПРОС ДОСТУПА</h1>
        <p>Введите первую часть кода, чтобы найти координаты объекта.</p>
        <input type="text" id="pass1" placeholder="Часть 1..." autocomplete="off" autofocus>
        <button onclick="checkPass1()">Установить связь</button>
        <div class="error-msg" id="err1">Неверный код. Связь отклонена.</div>
    </div>

    <script>
        function checkPass1() {
            const val = document.getElementById('pass1').value.trim().toUpperCase();
            const err = document.getElementById('err1');
            const box = document.getElementById('terminalBox');

            if (val === 'КОНТУР') {
                window.location.href = 'main.html';
            } else {
                err.style.display = 'block';
                box.style.transform = 'translateX(-10px)';
                setTimeout(() => box.style.transform = 'translateX(10px)', 50);
                setTimeout(() => box.style.transform = 'translateX(-10px)', 100);
                setTimeout(() => box.style.transform = 'translateX(0)', 150);
            }
        }

        document.getElementById('pass1').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') checkPass1();
        });
    </script>
</body>
</html>
