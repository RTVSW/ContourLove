<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Терминал — Наше Пространство</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Marck+Script&family=Manrope:wght@400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --gold: #e8c87a;
            --gold-bright: #f5d98a;
            --dark: #0a0705;
            --panel: rgba(20, 15, 10, 0.95);
            --text: #f0e6d8;
            --border: rgba(232, 200, 122, 0.3);
            --error: #e04545;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            background: var(--dark);
            color: var(--text);
            font-family: "Manrope", sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-image: 
                radial-gradient(circle at 50% 50%, rgba(232, 200, 122, 0.08) 0%, transparent 60%),
                url('https://images.unsplash.com/photo-1506318137071-a8e063b4bec0?q=80&w=1920&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background: rgba(10, 7, 5, 0.9);
            z-index: -1;
        }

        /* Приборная панель */
        .terminal-panel {
            background: var(--panel);
            border: 1px solid var(--border);
            padding: 40px 30px;
            border-radius: 16px;
            text-align: center;
            width: 90%;
            max-width: 420px;
            box-shadow: 0 0 40px rgba(0,0,0,0.8), inset 0 0 20px rgba(232, 200, 122, 0.05);
            position: relative;
            overflow: hidden;
        }

        .terminal-panel::before {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 2px;
            background: linear-gradient(90deg, transparent, var(--gold), transparent);
            animation: scan 3s infinite linear;
        }

        @keyframes scan {
            0% { transform: translateY(0); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(500px); opacity: 0; }
        }

        .title {
            font-family: "Playfair Display", serif;
            font-size: 24px;
            color: var(--gold);
            margin-bottom: 20px;
            font-style: italic;
            letter-spacing: 0.1em;
        }

        /* Вкладки */
        .tabs {
            display: flex;
            margin-bottom: 25px;
            border-bottom: 1px solid var(--border);
        }

        .tab {
            flex: 1;
            padding: 10px;
            cursor: pointer;
            font-family: "Playfair Display", serif;
            font-size: 16px;
            color: #a89680;
            transition: 0.3s;
            border-bottom: 2px solid transparent;
        }

        .tab.active {
            color: var(--gold);
            border-bottom: 2px solid var(--gold);
        }

        /* Формы */
        .form-container {
            display: none;
            animation: fadeIn 0.4s ease;
        }

        .form-container.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .input-group {
            margin-bottom: 15px;
            text-align: left;
            position: relative;
        }

        .input-group input {
            width: 100%;
            background: rgba(0,0,0,0.6);
            border: 1px solid var(--border);
            padding: 14px 40px 14px 14px;
            color: #fff;
            font-size: 15px;
            border-radius: 8px;
            outline: none;
            transition: 0.3s;
            font-family: "Manrope";
        }

        .input-group input:focus {
            border-color: var(--gold);
            box-shadow: 0 0 10px rgba(232, 200, 122, 0.2);
        }

        /* Иконка глаза */
        .eye-icon {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #a89680;
            font-size: 18px;
            transition: 0.3s;
            user-select: none;
        }

        .eye-icon:hover { color: var(--gold); }

        /* Выбор пола */
        .gender-select {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin: 20px 0;
        }

        .gender-btn {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            cursor: pointer;
            background: transparent;
            border: 2px solid var(--border);
            color: #a89680;
            font-size: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.3s;
        }

        .gender-btn.active[data-gender="him"] { background: #6cb4ee; color: #000; border-color: #6cb4ee; box-shadow: 0 0 20px rgba(108, 180, 238, 0.4); }
        .gender-btn.active[data-gender="her"] { background: #e88ca8; color: #000; border-color: #e88ca8; box-shadow: 0 0 20px rgba(232, 140, 168, 0.4); }

        .submit-btn {
            width: 100%;
            padding: 15px;
            border-radius: 8px;
            background: linear-gradient(145deg, var(--gold), #c9a24d);
            color: var(--dark);
            font-family: "Cinzel", serif;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            border: none;
            text-transform: uppercase;
            transition: 0.3s;
            margin-top: 10px;
        }

        .submit-btn:hover {
            box-shadow: 0 0 20px rgba(232, 200, 122, 0.4);
            transform: translateY(-2px);
        }

        .error-msg {
            color: var(--error);
            font-size: 13px;
            margin-top: 15px;
            display: none;
            text-align: center;
        }

        /* Подпись */
        .managed-by {
            position: fixed;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            font-family: "Cinzel", serif;
            font-size: 11px;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: rgba(232, 200, 122, 0.4);
            pointer-events: none;
            text-align: center;
            width: 100%;
        }
    </style>
</head>
<body>

    <div class="terminal-panel">
        <div class="title">Приборная панель</div>
        
        <div class="tabs">
            <div class="tab active" onclick="switchTab('login')">Вход</div>
            <div class="tab" onclick="switchTab('register')">Регистрация</div>
        </div>

        <!-- ФОРМА ВХОДА -->
        <div id="loginForm" class="form-container active">
            <div class="input-group">
                <input type="email" id="loginEmail" placeholder="Email" autocomplete="off">
            </div>
            <div class="input-group">
                <input type="password" id="loginPassword" placeholder="Пароль" autocomplete="off">
                <span class="eye-icon" onclick="togglePassword('loginPassword', this)">👁️</span>
            </div>
            <button class="submit-btn" onclick="loginUser()">Войти в систему</button>
        </div>

        <!-- ФОРМА РЕГИСТРАЦИИ -->
        <div id="registerForm" class="form-container">
            <div class="input-group">
                <input type="text" id="regNickname" placeholder="Ваш никнейм (Имя)" autocomplete="off">
            </div>
            <div class="input-group">
                <input type="email" id="regEmail" placeholder="Email" autocomplete="off">
            </div>
            <div class="input-group">
                <input type="password" id="regPassword" placeholder="Пароль (мин. 6 символов)" autocomplete="off">
                <span class="eye-icon" onclick="togglePassword('regPassword', this)">👁️</span>
            </div>

            <div class="gender-select">
                <button class="gender-btn" data-gender="him" onclick="selectGender('him')">♂</button>
                <button class="gender-btn" data-gender="her" onclick="selectGender('her')">♀</button>
            </div>

            <button class="submit-btn" onclick="registerUser()">Создать профиль</button>
        </div>

        <div class="error-msg" id="errorMsg"></div>
    </div>

    <div class="managed-by">Под управлением Теневого Контура</div>

    <!-- ================= СКРИПТЫ ================= -->
    <script>
        let selectedGender = null;

        // Переключение вкладок
        function switchTab(tab) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.form-container').forEach(f => f.classList.remove('active'));
            document.getElementById('errorMsg').style.display = 'none';

            if (tab === 'login') {
                document.querySelector('.tab:nth-child(1)').classList.add('active');
                document.getElementById('loginForm').classList.add('active');
            } else {
                document.querySelector('.tab:nth-child(2)').classList.add('active');
                document.getElementById('registerForm').classList.add('active');
            }
        }

        // Показать/скрыть пароль
        function togglePassword(inputId, icon) {
            const input = document.getElementById(inputId);
            if (input.type === 'password') {
                input.type = 'text';
                icon.style.opacity = '1';
                icon.style.color = 'var(--gold)';
            } else {
                input.type = 'password';
                icon.style.opacity = '0.6';
                icon.style.color = '#a89680';
            }
        }

        // Выбор пола
        function selectGender(gender) {
            selectedGender = gender;
            document.querySelectorAll('.gender-btn').forEach(btn => {
                btn.classList.remove('active');
                if (btn.dataset.gender === gender) btn.classList.add('active');
            });
        }

        function showError(msg) {
            const err = document.getElementById('errorMsg');
            err.textContent = msg;
            err.style.display = 'block';
        }

        // --- ЛОГИКА FIREBASE ---
        window.loginUser = async function() {
            const email = document.getElementById('loginEmail').value.trim();
            const pass = document.getElementById('loginPassword').value;

            if (!email || !pass) return showError("Заполните все поля.");
            if (window.firebaseLogin) window.firebaseLogin(email, pass);
        }

        window.registerUser = async function() {
            const nick = document.getElementById('regNickname').value.trim();
            const email = document.getElementById('regEmail').value.trim();
            const pass = document.getElementById('regPassword').value;

            if (!nick || !email || !pass) return showError("Заполните все поля.");
            if (!selectedGender) return showError("Выберите символ ♂ или ♀.");
            if (pass.length < 6) return showError("Пароль должен быть от 6 символов.");

            if (window.firebaseRegister) window.firebaseRegister(nick, email, pass, selectedGender);
        }
    </script>

    <!-- ================= FIREBASE ================= -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getDatabase, ref, set } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCwLURoXuJr7GjmvBDB18Tg0rwdI-0TkDc",
            authDomain: "love-a3e53.firebaseapp.com",
            databaseURL: "https://love-a3e53-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "love-a3e53",
            storageBucket: "love-a3e53.firebasestorage.app",
            messagingSenderId: "233454280895",
            appId: "1:233454280895:web:9b0c89b11127e8198be60a"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const auth = getAuth(app);

        // ВХОД
        window.firebaseLogin = async function(email, password) {
            try {
                await signInWithEmailAndPassword(auth, email, password);
                // Если успешно, перекидываем на экран комнат
                window.location.href = 'rooms.html';
            } catch (error) {
                document.getElementById('errorMsg').textContent = "Неверный email или пароль.";
                document.getElementById('errorMsg').style.display = 'block';
            }
        };

        // РЕГИСТРАЦИЯ
        window.firebaseRegister = async function(nickname, email, password, gender) {
            try {
                // Создаем пользователя в системе аутентификации
                const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                const uid = userCredential.user.uid;

                // Сохраняем профиль в базу данных (БЕЗ КОМНАТЫ, комната будет позже)
                await set(ref(db, 'users/' + uid), {
                    nickname: nickname,
                    email: email,
                    gender: gender
                });

                // Перекидываем на экран комнат
                window.location.href = 'rooms.html';
            } catch (error) {
                if (error.code === 'auth/email-already-in-use') {
                    document.getElementById('errorMsg').textContent = "Этот email уже зарегистрирован.";
                } else {
                    document.getElementById('errorMsg').textContent = "Ошибка: " + error.message;
                }
                document.getElementById('errorMsg').style.display = 'block';
            }
        };
    </script>
</body>
</html>
