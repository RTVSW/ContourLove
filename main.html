<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Наше Пространство</title>
    
    <!-- ФАВИКОНКИ -->
    <link rel="icon" type="image/png" href="favicon-32x32.png">
    <link rel="icon" type="image/png" href="favicon-16x16.png">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">

    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Marck+Script&family=Manrope:wght@400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold: #e8c87a;
            --gold-bright: #f5d98a;
            --dark: #0a0705;
            --panel: rgba(20, 15, 10, 0.95);
            --text: #f0e6d8;
            --border: rgba(232, 200, 122, 0.3);
            --parchment: #f4e8d3;
            --ink: #2b1a10;
            --color-him: #6cb4ee; 
            --color-her: #e88ca8; 
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            background: var(--dark);
            color: var(--text);
            font-family: "Manrope", sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-image: 
                radial-gradient(circle at 50% 50%, rgba(232, 200, 122, 0.08) 0%, transparent 60%),
                url('https://images.unsplash.com/photo-1506318137071-a8e063b4bec0?q=80&w=1920&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            overflow: hidden;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background: rgba(10, 7, 5, 0.85);
            z-index: -1;
        }

        /* ================= ЭТАП 2: СЕЙФ ================= */
        #safe-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100vh;
            position: fixed;
            inset: 0;
            z-index: 2000;
            transition: opacity 1s ease, visibility 1s ease;
            background: var(--dark);
        }

        #safe-screen.hide { opacity: 0; visibility: hidden; pointer-events: none; }

        .safe-container {
            position: relative;
            width: 280px;
            height: 360px;
            background: #1c130d;
            border: 3px solid var(--border);
            border-radius: 8px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.9), inset 0 0 30px rgba(0,0,0,0.5);
            cursor: pointer;
            transition: transform 0.3s ease;
            perspective: 1000px;
        }

        .safe-container:hover { transform: scale(1.02); }

        .safe-door {
            position: absolute;
            inset: 0;
            background: linear-gradient(to bottom, #251b14, #150e09);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1);
            transform-origin: left center;
            z-index: 2;
            border-radius: 6px;
            border: 1px solid rgba(232, 200, 122, 0.2);
        }

        .safe-container.open .safe-door { transform: rotateY(-110deg); }

        .wax-seal-bible {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: radial-gradient(circle, #8a2b2b 0%, #4a1010 100%);
            border: 2px solid #a83232;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.8), 0 5px 15px rgba(0,0,0,0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            margin-bottom: 20px;
        }

        .wax-seal-bible::before {
            content: "";
            position: absolute;
            width: 70px;
            height: 70px;
            background: url('logo.png') no-repeat center center;
            background-size: contain;
            opacity: 0.8;
            filter: grayscale(1) brightness(2);
        }

        .safe-hint-bible {
            font-family: "Playfair Display", serif;
            font-size: 16px;
            letter-spacing: 0.1em;
            color: var(--gold);
            font-style: italic;
            text-align: center;
            padding: 0 20px;
        }

        .safe-inside {
            position: absolute;
            inset: 0;
            background: #0a0705;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1;
            color: var(--gold);
            font-family: "Playfair Display", serif;
            font-size: 20px;
            text-align: center;
        }

        /* ================= МОДАЛКА (ВХОД/РЕГИСТРАЦИЯ) ================= */
        .modal-overlay {
            display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85);
            z-index: 4000; justify-content: center; align-items: center; backdrop-filter: blur(5px);
        }
        .modal-box {
            background: var(--panel); border: 1px solid var(--gold); padding: 30px;
            border-radius: 16px; width: 90%; max-width: 350px; text-align: center;
            box-shadow: 0 0 30px rgba(232, 200, 122, 0.2);
        }
        .modal-box h2 { font-family: "Playfair Display", serif; font-style: italic; color: var(--gold); margin-bottom: 15px; font-size: 22px; }
        
        .modal-box input {
            width: 100%; background: rgba(0,0,0,0.6); border: 1px solid var(--border);
            padding: 14px; color: #fff; font-size: 15px; border-radius: 8px;
            margin-bottom: 15px; outline: none; font-family: "Manrope";
        }

        .gender-select {
            display: flex; gap: 15px; margin-bottom: 20px; justify-content: center;
        }

        .gender-btn {
            width: 60px; height: 60px; border-radius: 50%; cursor: pointer; 
            background: transparent; border: 2px solid var(--border); color: #a89680;
            font-size: 28px; display: flex; align-items: center; justify-content: center;
            transition: 0.3s;
        }

        .gender-btn.active[data-gender="him"] { background: var(--color-him); color: var(--dark); border-color: var(--color-him); box-shadow: 0 0 20px rgba(108, 180, 238, 0.4); }
        .gender-btn.active[data-gender="her"] { background: var(--color-her); color: var(--dark); border-color: var(--color-her); box-shadow: 0 0 20px rgba(232, 140, 168, 0.4); }

        .modal-actions { display: flex; gap: 10px; flex-direction: column; }
        
        .modal-actions button { 
            width: 100%; padding: 14px; border-radius: 8px; cursor: pointer; font-weight: 600; 
            background: var(--gold); color: var(--dark); border: none; text-transform: uppercase;
            transition: 0.3s;
        }
        .modal-actions button:hover { box-shadow: 0 0 20px rgba(232, 200, 122, 0.4); }

        #auth-error { color: #e04545; font-size: 13px; margin-top: 15px; display: none; }

        /* ================= ЭТАП 3: САЙТ ================= */
        #main-site {
            display: none;
            padding: 30px 20px 80px;
            max-width: 900px;
            margin: 0 auto;
            width: 100%;
            height: 100vh;
            overflow-y: auto;
            position: fixed;
            inset: 0;
            z-index: 1000;
        }

        .header { text-align: center; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; }
        .header h1 {
            font-family: "Playfair Display", serif;
            font-size: clamp(20px, 5vw, 30px);
            color: var(--gold);
            letter-spacing: 0.1em;
            font-style: italic;
        }

        .logout-btn {
            background: transparent; border: 1px solid #e04545; color: #e04545;
            padding: 8px 15px; border-radius: 8px; cursor: pointer; font-size: 12px;
        }

        .counter-panel {
            background: var(--panel); border: 1px solid var(--border); border-radius: 16px;
            padding: 25px 10px; text-align: center; margin-bottom: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .counter-title { font-family: "Playfair Display", serif; font-style: italic; color: var(--gold); font-size: 16px; margin-bottom: 15px; }
        .counter-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; max-width: 600px; margin: 0 auto; }
        .counter-box { background: rgba(0,0,0,0.4); border: 1px solid rgba(232, 200, 122, 0.2); padding: 10px 5px; border-radius: 8px; }
        .counter-num { font-family: "Playfair Display", serif; font-size: clamp(20px, 5vw, 28px); color: var(--text); font-weight: 700; }
        .counter-label { font-size: 10px; color: #a89680; text-transform: uppercase; margin-top: 5px; }

        .panel {
            background: var(--panel); border: 1px solid var(--border); border-radius: 16px;
            padding: 25px 20px; margin-bottom: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .section-title {
            font-family: "Playfair Display", serif; font-style: italic; color: var(--gold); font-size: 20px;
            margin-bottom: 20px; text-align: center; border-bottom: 1px solid var(--border); padding-bottom: 10px;
        }

        .mood-inputs { display: flex; flex-direction: column; gap: 15px; max-width: 400px; margin: 0 auto 20px; }
        .mood-row input[type="date"], .mood-row select {
            background: rgba(0,0,0,0.6) !important; border: 1px solid var(--border); color: var(--text);
            padding: 12px; border-radius: 8px; font-family: "Manrope"; width: 100%; outline: none; -webkit-appearance: none;
        }
        .mood-row button, .send-btn {
            background: linear-gradient(145deg, var(--gold), #c9a24d) !important; color: var(--dark) !important;
            border: none; padding: 14px; border-radius: 8px; font-weight: 700; font-size: 14px;
            cursor: pointer; transition: 0.3s; text-transform: uppercase; width: 100%;
        }

        .mood-history { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
        .mood-item {
            background: rgba(0,0,0,0.4); border: 2px solid rgba(255,255,255,0.1);
            padding: 12px 10px 10px; border-radius: 10px; display: flex; flex-direction: column;
            align-items: center; gap: 5px; position: relative; min-width: 80px;
        }
        .mood-date { font-size: 11px; color: #a89680; }
        .mood-emoji { font-size: 28px; }
        .mood-user { font-size: 11px; font-weight: bold; margin-top: 2px; text-transform: uppercase; }
        .mood-item[data-user="him"] { border-color: var(--color-him); }
        .mood-item[data-user="him"] .mood-user { color: var(--color-him); }
        .mood-item[data-user="her"] { border-color: var(--color-her); }
        .mood-item[data-user="her"] .mood-user { color: var(--color-her); }

        .delete-mood { position: absolute; top: 2px; right: 4px; background: transparent; border: none; color: #a89680; font-size: 16px; cursor: pointer; }
        .delete-mood:hover { color: #e04545; }

        .letter-form textarea {
            width: 100%; height: 100px; background: rgba(0,0,0,0.6); border: 1px solid var(--border);
            color: var(--text); padding: 12px; border-radius: 8px; font-family: "Manrope"; resize: none;
            margin-bottom: 10px; outline: none;
        }
        .letters-list { display: flex; flex-direction: column; gap: 20px; margin-top: 20px; }
        .letter-card {
            background: var(--parchment); color: var(--ink); padding: 25px 20px; border-radius: 4px;
            font-family: "Marck Script", cursive; font-size: 22px; line-height: 1.4;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5); position: relative;
        }
        .letter-card::before {
            content: ""; position: absolute; inset: 0; pointer-events: none;
            background: url('https://www.transparenttextures.com/patterns/aged-paper.png'); opacity: 0.4;
        }
        .letter-meta {
            font-family: "Manrope"; font-size: 12px; color: #6b4c3a; margin-bottom: 10px;
            border-bottom: 1px dashed #b09b89; padding-bottom: 5px; display: flex; justify-content: space-between;
            text-transform: uppercase;
        }
        .letter-text { white-space: pre-wrap; position: relative; z-index: 1; }
        .delete-letter {
            position: absolute; top: 5px; right: 10px; background: transparent; border: none;
            color: #a83232; font-size: 24px; cursor: pointer; z-index: 10; opacity: 0.5; transition: 0.2s;
        }

        @media (max-width: 400px) { .safe-container { transform: scale(0.9); } }
    </style>
</head>
<body>

    <!-- СЕЙФ -->
    <div id="safe-screen">
        <div class="safe-container" id="safe" onclick="checkAuthPrompt()">
            <div class="safe-inside">ДОСТУП<br>РАЗРЕШЕН</div>
            <div class="safe-door">
                <div class="wax-seal-bible"></div>
                <div class="safe-hint-bible">Снимите печать<br>для входа</div>
            </div>
        </div>
    </div>

    <!-- САЙТ -->
    <div id="main-site">
        <div class="header">
            <h1>Наше Писание</h1>
            <button class="logout-btn" onclick="logoutUser()">Выйти</button>
        </div>

        <div id="appContent">
            <!-- СЧЕТЧИК -->
            <div class="counter-panel">
                <div class="counter-title">Времени в пути</div>
                <div class="counter-grid">
                    <div class="counter-box"><div class="counter-num" id="years">0</div><div class="counter-label">Лет</div></div>
                    <div class="counter-box"><div class="counter-num" id="months">0</div><div class="counter-label">Мес</div></div>
                    <div class="counter-box"><div class="counter-num" id="days">0</div><div class="counter-label">Дней</div></div>
                    <div class="counter-box"><div class="counter-num" id="hours">0</div><div class="counter-label">Часов</div></div>
                    <div class="counter-box"><div class="counter-num" id="minutes">0</div><div class="counter-label">Минут</div></div>
                    <div class="counter-box"><div class="counter-num" id="seconds">0</div><div class="counter-label">Секунд</div></div>
                </div>
            </div>

            <!-- ДНЕВНИК -->
            <div class="panel">
                <div class="section-title">Книга Чувств</div>
                <div class="mood-inputs">
                    <div class="mood-row">
                        <input type="date" id="moodDate">
                        <select id="moodEmoji">
                            <option value="😍">😍 Влюблен(а)</option>
                            <option value="😊">😊 Счастлив(а)</option>
                            <option value="😐">😐 Спокойно</option>
                            <option value="😔">😔 Печально</option>
                            <option value="😡">😡 В гневе</option>
                            <option value="🥱">🥱 Утомлен(а)</option>
                        </select>
                    </div>
                    <div class="mood-row">
                        <button onclick="addMood()">Вписать в книгу</button>
                    </div>
                </div>
                <div class="mood-history" id="moodHistory"></div>
            </div>

            <!-- ПИСЬМА -->
            <div class="panel">
                <div class="section-title">Послания</div>
                <div class="letter-form">
                    <textarea id="letterText" placeholder="Напишите послание..."></textarea>
                    <button class="send-btn" onclick="sendLetter()">Отправить</button>
                </div>
                <div class="letters-list" id="lettersList"></div>
            </div>
        </div>
    </div>

    <!-- МОДАЛКА (УМНЫЙ ВХОД) -->
    <div id="password-modal" class="modal-overlay">
        <div class="modal-box" id="modal-box">
            <h2>Врата открыты</h2>
            
            <input type="email" id="authEmail" placeholder="Email" autocomplete="off">
            <input type="password" id="authPassword" placeholder="Пароль (мин. 6 символов)" autocomplete="off">
            
            <input type="text" id="roomCode" placeholder="Код вашей комнаты" style="border-color: var(--gold);" autocomplete="off">

            <div class="gender-select">
                <button class="gender-btn" data-gender="him" onclick="selectGender('him')">♂</button>
                <button class="gender-btn" data-gender="her" onclick="selectGender('her')">♀</button>
            </div>

            <div class="modal-actions">
                <button onclick="smartAuth()">Войти / Создать</button>
            </div>
            
            <div id="auth-error"></div>
        </div>
    </div>

    <!-- ================= ОСНОВНОЙ СКРИПТ ================= -->
    <script>
        let currentUserGender = null;

        function checkAuthPrompt() {
            document.getElementById('password-modal').style.display = 'flex';
            document.getElementById('auth-error').style.display = 'none';
            setTimeout(() => document.getElementById('authEmail').focus(), 100);
        }

        function selectGender(gender) {
            currentUserGender = gender;
            document.querySelectorAll('.gender-btn').forEach(btn => {
                btn.classList.remove('active');
                if (btn.dataset.gender === gender) btn.classList.add('active');
            });
        }

        function showError(msg) {
            const err = document.getElementById('auth-error');
            err.textContent = msg;
            err.style.display = 'block';
        }

        // --- СЧЕТЧИК ---
        const startDate = new Date(2023, 9, 25, 0, 0, 0); 
        function updateCounter() {
            const now = new Date();
            let years = now.getFullYear() - startDate.getFullYear();
            let months = now.getMonth() - startDate.getMonth();
            let days = now.getDate() - startDate.getDate();

            if (days < 0) { months--; const prevMonth = new Date(now.getFullYear(), now.getMonth(), 0); days += prevMonth.getDate(); }
            if (months < 0) { years--; months += 12; }

            let tempDate = new Date(startDate);
            tempDate.setFullYear(startDate.getFullYear() + years);
            tempDate.setMonth(tempDate.getMonth() + months);
            let diffMs = now - tempDate;

            let hours = Math.floor((diffMs / (1000 * 60 * 60)) % 24);
            let minutes = Math.floor((diffMs / (1000 * 60)) % 60);
            let seconds = Math.floor((diffMs / 1000) % 60);

            document.getElementById('years').textContent = years;
            document.getElementById('months').textContent = months;
            document.getElementById('days').textContent = days;
            document.getElementById('hours').textContent = hours.toString().padStart(2, '0');
            document.getElementById('minutes').textContent = minutes.toString().padStart(2, '0');
            document.getElementById('seconds').textContent = seconds.toString().padStart(2, '0');
        }
        setInterval(updateCounter, 1000);
        document.getElementById('moodDate').valueAsDate = new Date();

        // --- ДНЕВНИК ---
        window.renderMoodsFromCloud = function(moods) {
            const history = document.getElementById('moodHistory');
            history.innerHTML = '';

            if (moods.length === 0) {
                history.innerHTML = '<p style="color: #a89680; font-size: 14px; text-align: center; width: 100%;">Пока тихо...</p>';
                return;
            }

            moods.forEach(m => {
                const d = new Date(m.date);
                const dateStr = `${d.getDate().toString().padStart(2, '0')}.${(d.getMonth()+1).toString().padStart(2, '0')}.${d.getFullYear()}`;
                let userLabel = m.user === 'him' ? '♂' : (m.user === 'her' ? '♀' : '');
                
                const div = document.createElement('div');
                div.className = 'mood-item';
                if(m.user) div.setAttribute('data-user', m.user);
                
                div.innerHTML = `
                    <div class="mood-date">${dateStr}</div>
                    <div class="mood-emoji">${m.emoji}</div>
                    <div class="mood-user" style="font-size: 18px;">${userLabel}</div>
                    <button class="delete-mood" onclick="deleteMood('${m.dbId}')" title="Удалить">×</button>
                `;
                history.appendChild(div);
            });
        };

        function addMood() {
            const date = document.getElementById('moodDate').value;
            const emoji = document.getElementById('moodEmoji').value;
            
            if (!date) return alert("Выберите дату!");
            if (window.saveMoodToCloud) window.saveMoodToCloud(date, emoji, currentUserGender);
        }

        function deleteMood(dbId) {
            if (!confirm('Стереть эту запись?')) return;
            if (window.deleteMoodFromCloud) window.deleteMoodFromCloud(dbId);
        }

        // --- ПИСЬМА ---
        window.renderLettersFromCloud = function(letters) {
            const list = document.getElementById('lettersList');
            list.innerHTML = '';

            if (letters.length === 0) {
                list.innerHTML = '<p style="color: #a89680; font-size: 14px; text-align: center;">Писем пока нет.</p>';
                return;
            }

            letters.forEach(l => {
                const d = new Date(l.timestamp);
                const dateStr = `${d.getDate().toString().padStart(2, '0')}.${(d.getMonth()+1).toString().padStart(2, '0')}.${d.getFullYear()} в ${d.getHours().toString().padStart(2, '0')}:${d.getMinutes().toString().padStart(2, '0')}`;
                const userLabel = l.user === 'him' ? 'От ♂' : 'От ♀';
                const userColor = l.user === 'him' ? 'var(--color-him)' : 'var(--color-her)';

                const div = document.createElement('div');
                div.className = 'letter-card';
                div.innerHTML = `
                    <button class="delete-letter" onclick="deleteLetter('${l.dbId}')" title="Сжечь">×</button>
                    <div class="letter-meta">
                        <span style="color: ${userColor}; font-weight: bold; font-size: 14px;">${userLabel}</span>
                        <span>${dateStr}</span>
                    </div>
                    <div class="letter-text">${l.text}</div>
                `;
                list.appendChild(div);
            });
        };

        function sendLetter() {
            const text = document.getElementById('letterText').value.trim();
            if (!text) return;
            if (window.saveLetterToCloud) window.saveLetterToCloud(text, currentUserGender);
            document.getElementById('letterText').value = '';
        }

        function deleteLetter(dbId) {
            if (!confirm('Сжечь это письмо?')) return;
            if (window.deleteLetterFromCloud) window.deleteLetterFromCloud(dbId);
        }

        // --- ОТКРЫТИЕ САЙТА ---
        function openSite() {
            document.getElementById('safe').classList.add('open');
            document.getElementById('password-modal').style.display = 'none';
            setTimeout(() => {
                document.getElementById('safe-screen').classList.add('hide');
                document.getElementById('main-site').style.display = 'block';
            }, 800);
        }

        function logoutUser() {
            if (window.firebaseLogout) { window.firebaseLogout().then(() => { location.reload(); }); }
        }

        // --- УМНАЯ АВТОРИЗАЦИЯ ---
        async function smartAuth() {
            const email = document.getElementById('authEmail').value.trim();
            const pass = document.getElementById('authPassword').value;
            const room = document.getElementById('roomCode').value.trim();
            
            if (!email || !pass || !room) return showError("Заполните Email, Пароль и Код комнаты.");
            if (pass.length < 6) return showError("Пароль должен быть от 6 символов.");

            try {
                // 1. Пытаемся войти
                await window.loginInFirebase(email, pass, room);
            } catch (error) {
                // 2. Если не получилось войти
                if (error.code === 'auth/user-not-found' || error.code === 'auth/invalid-login-credentials') {
                    // Пользователя нет — регистрируем!
                    if (!currentUserGender) {
                        return showError("Аккаунт не найден. Для регистрации выберите символ ♂ или ♀.");
                    }
                    try {
                        await window.registerInFirebase(email, pass, currentUserGender, room);
                    } catch (regError) {
                        showError("Ошибка регистрации: " + regError.message);
                    }
                } else if (error.code === 'auth/wrong-password') {
                    showError("Неверный пароль для этого аккаунта.");
                } else {
                    showError("Ошибка: " + error.message);
                }
            }
        }
    </script>

    <!-- ================= FIREBASE ================= -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getDatabase, ref, onValue, set, remove, push, get } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCwLURoXuJr7GjmvBDB18Tg0rwdI-0TkDc",
            authDomain: "love-a3e53.firebaseapp.com",
            databaseURL: "https://love-a3e53-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "love-a3e53",
            storageBucket: "love-a3e53.firebasestorage.app",
            messagingSenderId: "233454280895",
            appId: "1:233454280895:web:9b0c89b11127e8198be60a"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const auth = getAuth(app);

        // ПОДКЛЮЧЕНИЕ К ДАННЫМ КОМНАТЫ
        function setupRoomListeners(roomCode) {
            if (window.currentRoomCode === roomCode) return; 
            window.currentRoomCode = roomCode;

            const moodsRef = ref(db, 'rooms/' + roomCode + '/moods');
            const lettersRef = ref(db, 'rooms/' + roomCode + '/letters');

            window.saveMoodToCloud = function(date, emoji, gender) {
                const moodId = date + '_' + gender; 
                set(ref(db, 'rooms/' + roomCode + '/moods/' + moodId), { date: date, emoji: emoji, user: gender });
            };

            window.deleteMoodFromCloud = function(id) {
                remove(ref(db, 'rooms/' + roomCode + '/moods/' + id));
            };

            onValue(moodsRef, (snapshot) => {
                const data = snapshot.val();
                const moods = [];
                if (data) { for (let key in data) { const mood = data[key]; mood.dbId = key; moods.push(mood); } }
                moods.sort((a, b) => new Date(b.date) - new Date(a.date));
                window.renderMoodsFromCloud(moods);
            });

            window.saveLetterToCloud = function(text, gender) {
                const newLetterRef = push(lettersRef);
                set(newLetterRef, { text: text, user: gender, timestamp: Date.now() });
            };

            window.deleteLetterFromCloud = function(id) {
                remove(ref(db, 'rooms/' + roomCode + '/letters/' + id));
            };

            onValue(lettersRef, (snapshot) => {
                const data = snapshot.val();
                const letters = [];
                if (data) { for (let key in data) { const letter = data[key]; letter.dbId = key; letters.push(letter); } }
                letters.sort((a, b) => b.timestamp - a.timestamp);
                window.renderLettersFromCloud(letters);
            });
        }

        // РЕГИСТРАЦИЯ (ВЫДАЕМ ОШИБКУ НАРУЖУ)
        window.registerInFirebase = async function(email, password, gender, roomCode) {
            const userCredential = await createUserWithEmailAndPassword(auth, email, password);
            
            await set(ref(db, 'users/' + userCredential.user.uid + '/profile'), {
                gender: gender, email: email, room: roomCode
            });
            
            setupRoomListeners(roomCode);
        };

        // ВХОД (ВЫДАЕМ ОШИБКУ НАРУЖУ)
        window.loginInFirebase = async function(email, password, roomCode) {
            const userCredential = await signInWithEmailAndPassword(auth, email, password);
            
            const profileRef = ref(db, 'users/' + userCredential.user.uid + '/profile/room');
            const snapshot = await get(profileRef);
            const savedRoom = snapshot.val();
            
            if (savedRoom && savedRoom !== roomCode) {
                await signOut(auth);
                throw new Error("Неверный код комнаты для этого аккаунта!");
            } else {
                setupRoomListeners(roomCode);
            }
        };

        window.firebaseLogout = async function() { await signOut(auth); };

        // АВТОМАТИЧЕСКИЙ ВХОД
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                const uid = user.uid;
                
                const profileRef = ref(db, 'users/' + uid + '/profile');
                onValue(profileRef, (snapshot) => {
                    const profile = snapshot.val();
                    if (profile) {
                        window.currentUserGender = profile.gender;
                        if (profile.room) {
                            setupRoomListeners(profile.room);
                            openSite();
                        }
                    }
                });
            } else {
                window.currentRoomCode = null;
                document.getElementById('safe-screen').classList.remove('hide');
                document.getElementById('safe').classList.remove('open');
                document.getElementById('main-site').style.display = 'none';
            }
        });
    </script>
